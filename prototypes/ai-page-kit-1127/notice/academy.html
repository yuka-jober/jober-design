<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴강 안내</title>
<!-- 미리보기 전용: 로컬에서 Pretendard 를 불러오기 위한 링크 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="../kit.css?v=22">
</head>
<body class="tone-sky">
<main class="page">
  <div class="top">
    <p class="logo-text">자버수학학원</p>
  </div>

  <div class="title">
    <span class="eyebrow is-accent">휴강</span>
    <h1>12월 4일(금) 휴강 안내</h1>
    <p class="lead">학부모님께 알려 드립니다.</p>
  </div>

  <div class="cal">
    <div class="cal-row is-off">
      <div class="cal-sheet"><span class="cal-m">12월</span><span class="cal-d">4</span><span class="cal-w">금</span></div>
      <div><p class="cal-label">휴강</p><p class="cal-desc">이날 수업은 쉽니다.</p></div>
    </div>
    <div class="cal-row">
      <div class="cal-sheet"><span class="cal-m">12월</span><span class="cal-d">11</span><span class="cal-w">금</span></div>
      <div><p class="cal-label">보강</p><p class="cal-desc">기존 수업과 같은 시간에 진행합니다.</p></div>
    </div>
  </div>

  <div class="contact">
    <p class="contact-name">자버수학학원</p>
  </div>
</main>
</body>
</html>
