<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자버 에스테틱 연말 휴무 안내</title>
<!-- 미리보기 전용: 로컬에서 Pretendard 를 불러오기 위한 링크 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="../kit.css?v=22">
</head>
<body class="tone-lilac">
<main class="page">
  <div class="top">
    <img class="logo" src="../assets/aesthetic-logo.png" alt="자버 에스테틱">
  </div>

  <div class="figure">
    <img src="../assets/aesthetic-photo.jpg" alt="">
  </div>

  <div class="title">
    <span class="eyebrow is-accent">연말 휴무</span>
    <h1>12월 24일(목)부터 이틀간 쉬어요</h1>
    <p class="lead">한 해 동안 찾아 주셔서 감사합니다. 연말 휴무 일정과 예약 안내를 확인해 주세요.</p>
  </div>

  <div class="cal">
    <div class="cal-row is-off">
      <div class="cal-sheet is-range"><span class="cal-m">12월</span><span class="cal-d">24–25</span><span class="cal-w">목–금</span></div>
      <div><p class="cal-label">휴무</p><p class="cal-desc">크리스마스 연휴</p></div>
    </div>
    <div class="cal-row">
      <div class="cal-sheet"><span class="cal-m">12월</span><span class="cal-d">26</span><span class="cal-w">토</span></div>
      <div><p class="cal-label">정상 영업</p><p class="cal-desc">오전 10시부터</p></div>
    </div>
  </div>

  <section class="sec">
    <h2>운영시간</h2>
    <dl class="info">
      <div><dt>평일</dt><dd>오전 10시 ~ 오후 8시</dd></div>
      <div><dt>토요일</dt><dd>오전 10시 ~ 오후 6시</dd></div>
      <div><dt>일요일</dt><dd class="is-accent">휴무</dd></div>
    </dl>
  </section>

  <section class="sec">
    <h2>연말 예약</h2>
    <ul class="bullets">
      <li>12월 마지막 주는 예약이 빨리 마감돼요.</li>
      <li>원하시는 날짜가 있으면 <strong>미리 예약</strong>해 주세요.</li>
    </ul>
  </section>

  <div class="pills">
    <a class="pill" href="#">네이버 예약하기</a>
    <a class="pill is-line" href="#">전화 문의</a>
  </div>
</main>
</body>
</html>
