<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온누리내과 진료시간 변경 안내</title>
<!-- 미리보기 전용: 로컬에서 Pretendard 를 불러오기 위한 링크 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="../kit.css?v=22">
</head>
<body class="tone-sky">
<main class="page">
  <header class="hero">
    <p class="hero-brand">온누리내과</p>
    <span class="hero-chip">진료시간 변경</span>
    <h1><span class="nowrap">12월 1일(화)부터</span><br>진료시간이 바뀝니다</h1>
  </header>

  <section class="sec">
    <h2>바뀐 진료시간</h2>
    <dl class="info">
      <div><dt>평일</dt><dd>오전 9시 ~ 오후 6시</dd></div>
      <div><dt>토요일</dt><dd>오전 9시 ~ 오후 1시</dd></div>
      <div><dt>점심시간</dt><dd>오후 1시 ~ 2시</dd></div>
      <div><dt>일·공휴일</dt><dd class="is-accent">휴진</dd></div>
    </dl>
  </section>

  <section class="sec">
    <div class="note">
      <p class="note-title">독감 예방접종</p>
      <p>예약 없이 방문하셔도 됩니다.</p>
    </div>
  </section>

  <div class="contact">
    <p class="contact-name">온누리내과</p>
  </div>
</main>
</body>
</html>
