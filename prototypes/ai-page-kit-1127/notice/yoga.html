<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그린요가 송년 모임</title>
<!-- 미리보기 전용: 로컬에서 Pretendard 를 불러오기 위한 링크 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="../kit.css?v=22">
</head>
<body class="tone-green">
<main class="page">
  <header class="hero is-dark">
    <p class="hero-brand">그린요가</p>
    <span class="hero-chip">송년 모임</span>
    <h1>그린요가 송년 모임에<br>초대합니다</h1>
    <p class="hero-meta">12월 18일(금) 저녁 7시 · 2층 스튜디오</p>
  </header>

  <div class="cal">
    <div class="cal-row is-off">
      <div class="cal-sheet"><span class="cal-m">12월</span><span class="cal-d">14</span><span class="cal-w">월</span></div>
      <div><p class="cal-label">참석 회신 마감</p><p class="cal-desc">이날까지 참석 여부를 알려 주세요.</p></div>
    </div>
  </div>

  <section class="sec">
    <h2>모임 안내</h2>
    <dl class="info">
      <div><dt>일시</dt><dd>12월 18일(금) 저녁 7시</dd></div>
      <div><dt>장소</dt><dd>그린요가 2층 스튜디오</dd></div>
      <div><dt>회비</dt><dd>2만원</dd></div>
    </dl>
    <p>간단한 다과와 함께 올해 수련 사진을 같이 볼 예정이에요.</p>
  </section>

  <div class="contact">
    <p class="contact-name">그린요가</p>
  </div>
</main>
</body>
</html>
