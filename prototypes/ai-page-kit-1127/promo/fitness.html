<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>럭키피트니스 프로모션</title>
<!-- 미리보기 전용: 로컬에서 Pretendard 를 불러오기 위한 링크 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="../kit.css?v=22">
</head>
<body class="tone-sky">
<main class="page promo">
  <div class="promo-top">
  <div class="top">
    <img class="logo" src="../assets/fitness-logo.png" alt="럭키피트니스">
  </div>

  <div class="promo-head">
    <p class="promo-kicker">회원님께 드리는 혜택</p>
    <h1>럭키피트니스<br>프로모션 오픈</h1>
    <p class="lead">보내주신 사랑에 보답하고자 이벤트를 엽니다. 상담을 원하시면 아래에서 신청해 주세요.</p>
  </div>
  </div>

  <div class="offers">
    <div>
      <div><p class="offers-name">2026 지방 삭제 이벤트</p><p class="offers-desc">5kg·10kg·15kg 감량 목표반</p></div>
      <p class="offers-value">5만원<small>할인</small></p>
    </div>
    <div>
      <div><p class="offers-name">회원권 연장 특별 혜택</p><p class="offers-desc">헬스장 이용권</p></div>
      <p class="offers-value">30%<small>할인</small></p>
    </div>
    <div>
      <div><p class="offers-name">럭키 필라테스 오픈 특가</p><p class="offers-desc">필라테스 신규 등록</p></div>
      <p class="offers-value">특가<small>오픈 기념</small></p>
    </div>
  </div>

  <div class="arch is-wide">
    <img src="../assets/fitness-photo.jpg" alt="">
  </div>

  <div class="pills">
    <a class="pill" href="#">상담 신청하기</a>
  </div>

  <p class="terms">이벤트 혜택은 상담 후 등록 시 적용됩니다.</p>
</main>
</body>
</html>
