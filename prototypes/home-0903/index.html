<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈 — 자버</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-base);
  background: var(--color-page);
  color: var(--color-text);
  /* 좌측 네비게이션 자리(1440 기준 약 80px). 이 프로토타입에서는 그리지 않고 폭만 비워둔다 */
  padding-left: 80px;
}

.home {
  display: flex;
  flex-direction: column;
  gap: 48px;
  max-width: 1600px;
  padding: 32px 40px 64px;
  margin: 0 auto;
}

/* ── HERO ─────────────────────────────────── */
.hero {
  padding: 56px;
  border-radius: var(--r-2xl);
  background: var(--color-hero-gradient);
  text-align: center;
}
.hero h1 {
  font-size: var(--fs-30);
  font-weight: var(--fw-bold);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-tight);
}
.hero p {
  margin-top: 4px;
  font-size: var(--fs-20);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text-secondary);
}

.hero-chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px;
  border: none;
  border-radius: var(--r-full);
  background: var(--color-surface-veil);
  cursor: pointer;
  font-family: var(--font-base);
  font-size: var(--fs-14);
  font-weight: var(--fw-medium);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text-secondary);
  transition: background-color var(--motion-standard) var(--ease-standard),
              color            var(--motion-standard) var(--ease-standard);
}
.chip:hover { background: var(--color-surface); color: var(--color-text); }
.chip:focus-visible { outline: none; box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }

.hero-search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 64px;
  max-width: 800px;
  margin: 16px auto 0;
  padding: 0 8px 0 24px;
  background: var(--color-surface);
  border-radius: var(--r-full);
  box-shadow: var(--shadow-1);
}
.hero-search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  text-align: left;
  font-family: var(--font-base);
  font-size: var(--fs-20);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text);
}
.hero-search input::placeholder { color: var(--color-disabled); }
.hero-search .go {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: var(--r-full);
  background: var(--color-bg-base);
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: background-color var(--motion-standard) var(--ease-standard),
              color            var(--motion-standard) var(--ease-standard);
}
.hero-search .go:hover { background: var(--color-primary); color: var(--color-on-primary); }

/* ── 주요 기능 ────────────────────────────── */
.features {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
}
.feature {
  display: flex;
  flex-direction: column;
  justify-content: space-between;   /* 아이콘은 좌측 상단에, 텍스트는 하단에 붙인다 */
  gap: 24px;
  padding: 28px;
  min-height: 196px;
}
.feature .tile {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: var(--r-lg);
}
.feature .tile .icon { width: 24px; height: 24px; }
.feature .tile-kakao  { background: var(--color-kakao);            color: var(--color-on-kakao); }

/* 메인 액션 — 다섯 중 하나만 카카오 계열로 띄운다 */
.feature-main { background: var(--color-kakao-subtle); }
.feature .tile-orange { background: var(--color-accent-orange-bg); color: var(--color-accent-orange-fg); }
.feature .tile-cyan   { background: var(--color-accent-cyan-bg);   color: var(--color-accent-cyan-fg); }
.feature .tile-purple { background: var(--color-accent-purple-bg); color: var(--color-accent-purple-fg); }
.feature .tile-blue   { background: var(--color-accent-blue-bg);   color: var(--color-accent-blue-fg); }

.feature b {
  display: block;
  font-size: var(--fs-24);
  font-weight: var(--fw-bold);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-tight);
}
.feature .desc {
  display: block;
  margin-top: 4px;
  font-size: var(--fs-14);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text-secondary);
}

/* ── 섹션 헤더 ────────────────────────────── */
.section {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 0 4px;
}
.section-head h2 {
  font-size: var(--fs-24);
  font-weight: var(--fw-bold);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-tight);   /* 24px 이상이라 자간을 조인다 */
}
.section-head .note {
  font-size: var(--fs-14);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text-secondary);
}

/* ── 하단 2단 ─────────────────────────────── */
.bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
.panel { position: relative; }
.panel h2 {
  font-size: var(--fs-30);
  font-weight: var(--fw-medium);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tighter);
}
.panel-close {
  position: absolute;
  top: 12px;
  right: 12px;
  color: var(--color-text-secondary);
}
.panel-lilac { background: var(--color-accent-lilac-bg); }   /* 카카오 채널 연동 */

/* 닫히는 중 */
.panel.is-dismissing {
  opacity: 0;
  transform: scale(0.98);
  transition:
    opacity   var(--motion-standard) var(--ease-exit),
    transform var(--motion-standard) var(--ease-exit);
}

/* 오른쪽 배너를 닫으면 왼쪽이 가로로 긴 배너가 된다 */
.bottom.is-solo { grid-template-columns: 1fr; }
.bottom.is-solo .onboard { grid-template-columns: auto 1fr; align-items: center; }
.bottom.is-solo .onboard-left { justify-content: center; gap: 12px; }
.bottom.is-solo .onboard-kicker { display: none; }   /* 가로 배너에선 제목만으로 충분 */
.bottom.is-solo .onboard h2 { font-size: var(--fs-24); }
.bottom.is-solo .guide-list { flex-direction: row; align-self: center; gap: 20px; }
.bottom.is-solo .guide-row { flex: 1; min-width: 0; }
.bottom.is-solo .guide-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 제목은 왼쪽, 가이드 버튼은 오른쪽에 쌓아 가로 길이를 절반으로 줄인다 */
.onboard {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;   /* 버튼 쪽에 폭을 더 준다 */
  gap: 32px;
  height: 100%;
}
/* 좌측: 제목은 위, 전체보기 버튼은 아래 */
.onboard-left {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 24px;
}
.onboard-left .btn { align-self: flex-start; }

.onboard .guide-list {
  align-self: end;          /* 가이드 버튼은 우하단에 */
}
.onboard-kicker {
  display: block;
  font-size: var(--fs-16);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text-secondary);
}
.onboard h2 {
  margin-top: 4px;   /* 크기는 .panel h2(30px)를 그대로 따른다 */
}

.guide-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.guide-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  height: 64px;
  padding: 0 20px;
  border: none;
  border-radius: var(--r-lg);
  background: var(--color-bg-base);
  cursor: pointer;
  font-family: var(--font-base);
  font-size: var(--fs-16);
  font-weight: var(--fw-medium);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text);
  transition: box-shadow var(--motion-standard) var(--ease-standard);
}
.guide-row:hover { background: var(--color-border-split); }
.guide-row:focus-visible { outline: none; box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }
.guide-row .chev { margin-left: auto; color: var(--color-disabled); }

/* 카카오 채널 연동 카드 */
.connect-body {
  display: flex;
  align-items: flex-end;
  gap: 24px;
  margin-top: 32px;
}
.connect-body .btn { flex-shrink: 0; }

/* 프로필 비교 이미지 — 기본 발송 프로필 vs 우리 가게 프로필 */
.connect-img {
  margin-left: auto;
  width: 100%;
  max-width: 420px;
  height: auto;
  border-radius: var(--r-lg);
}

/* ── 대량/예약발송 목록 ────────────────────── */
.bulk-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 48px 24px;
  border-radius: var(--r-lg);
  background: var(--color-bg-light);
  text-align: center;
}
.bulk-empty .icon { width: 40px; height: 40px; color: var(--color-disabled); }
.bulk-empty p {
  font-size: var(--fs-16);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  color: var(--color-text-secondary);
}

@media (max-width: 1320px) {
  .features { grid-template-columns: repeat(3, 1fr); }
  .bottom   { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  body { padding-left: 0; }   /* 좁은 화면에선 네비가 접히는 것으로 본다 */
  .home { padding: 20px 20px 40px; gap: 32px; }
  .hero { padding: 32px 24px; }
  .feature { min-height: 180px; padding: 24px; }
  .onboard { grid-template-columns: 1fr; gap: 24px; }
  .features { grid-template-columns: repeat(2, 1fr); }
  .connect-body { flex-direction: column; align-items: stretch; }
  .compare { margin-left: 0; }
}
</style>
</head>
<body>
<script src="../../assets/icons.js"></script>

<main class="home">

  <!-- ── HERO ───────────────────────────────────────────── -->
  <section class="hero">
    <h1>어떤 메시지를 보내고 싶으신가요?</h1>
    <p>3초만에 딱 맞는 카톡 템플릿을 찾아드려요</p>

    <div class="hero-chips">
      <button class="chip"><svg class="icon"><use href="#tag-outlined"></use></svg>쿠폰발송</button>
      <button class="chip"><svg class="icon"><use href="#environment-outlined"></use></svg>세미나 초대</button>
      <button class="chip"><svg class="icon"><use href="#user-outlined"></use></svg>회원가입</button>
      <button class="chip"><svg class="icon"><use href="#file-text-outlined"></use></svg>자료발송</button>
    </div>

    <form class="hero-search" onsubmit="return false">
      <input type="text" placeholder="" aria-label="발송할 내용">
      <button class="go" type="submit" aria-label="검색">
        <svg class="icon icon-lg"><use href="#arrow-right-outlined"></use></svg>
      </button>
    </form>
  </section>

  <!-- ── 주요 기능 ──────────────────────────────────────── -->
  <section class="features">
    <button class="card card-action feature feature-main">
      <span class="tile tile-kakao"><svg class="icon"><use href="#kakao-filled"></use></svg></span>
      <span class="txt">
        <b>카톡 보내기</b>
        <span class="desc">링크나 문서를 카톡으로 발송</span>
      </span>
    </button>

    <button class="card card-action feature">
      <span class="tile tile-orange"><svg class="icon"><use href="#coupon-filled"></use></svg></span>
      <span class="txt">
        <b>쿠폰 보내기</b>
        <span class="desc">혜택 주고 방문 유도하기</span>
      </span>
    </button>

    <button class="card card-action feature">
      <span class="tile tile-cyan"><svg class="icon"><use href="#edit-outlined"></use></svg></span>
      <span class="txt">
        <b>문서 보내기</b>
        <span class="desc">만들어둔 서식을 카톡으로 발송</span>
      </span>
    </button>

    <button class="card card-action feature">
      <span class="tile tile-purple"><svg class="icon"><use href="#file-add-outlined"></use></svg></span>
      <span class="txt">
        <b>서식 만들기</b>
        <span class="desc">콘텐츠·설문·전자계약 제작</span>
      </span>
    </button>

    <button class="card card-action feature">
      <span class="tile tile-blue"><svg class="icon"><use href="#usergroup-add-outlined"></use></svg></span>
      <span class="txt">
        <b>받는사람 추가</b>
        <span class="desc">휴대전화·이메일 등록</span>
      </span>
    </button>
  </section>

  <!-- ── 하단 2단 ───────────────────────────────────────── -->
  <section class="section">
    <div class="section-head">
      <h2>자버 활용하기</h2>
    </div>

    <div class="bottom">

    <section class="card card-lg panel">
      <div class="onboard">
        <div class="onboard-left">
          <div>
            <span class="onboard-kicker">자버가 처음이신가요?</span>
            <h2>이용 가이드</h2>
          </div>
          <button class="btn btn-xl btn-default">전체보기</button>
        </div>
        <div class="guide-list">
        <button class="guide-row">
          <svg class="icon icon-lg" style="color:var(--color-success)"><use href="#rocket-outlined"></use></svg>
          첫 이용 가이드
          <svg class="icon chev"><use href="#right-outlined"></use></svg>
        </button>
        <button class="guide-row">
          <svg class="icon icon-lg"><use href="#kakao"></use></svg>
          카톡 보내기
          <svg class="icon chev"><use href="#right-outlined"></use></svg>
        </button>
        <button class="guide-row">
          <svg class="icon icon-lg" style="color:var(--color-primary)"><use href="#file-done-outlined"></use></svg>
          전자서명 가이드
          <svg class="icon chev"><use href="#right-outlined"></use></svg>
        </button>
        </div>
      </div>
    </section>

    <section class="card card-lg panel panel-lilac">
      <button class="icon-btn icon-btn-sm panel-close" aria-label="닫기">
        <svg class="icon icon-lg"><use href="#close-outlined"></use></svg>
      </button>
      <h2>카카오 채널을 연동해<br>우리 회사 이름으로 알림톡을 발송하세요</h2>

      <div class="connect-body">
        <button class="btn btn-xl btn-white">연동하기</button>

        <img class="connect-img"
             src="../../assets/카카오 프로필 연동2.png"
             alt="기본 알림톡 발송 프로필과 카카오 프로필을 연동한 뒤의 비교">
      </div>
    </section>

    </div>
  </section>

  <!-- ── 대량/예약발송 목록 ─────────────────────────────── -->
  <section class="section">
    <div class="section-head">
      <h2>대량 · 예약발송 목록</h2>
      <button class="btn btn-md btn-link">
        전체보기
        <svg class="icon"><use href="#right-outlined"></use></svg>
      </button>
    </div>

    <div class="card card-lg">
    <div class="bulk-empty">
      <svg class="icon"><use href="#schedule-outlined"></use></svg>
      <p>아직 대량으로 발송한 내역이 없어요</p>
      <button class="btn btn-md btn-default">대량 작성 가이드 보기</button>
    </div>
    </div>
  </section>

</main>

<script>
/* 히어로 검색창 — 칩과 짝지은 예시 문구를 순서대로 타이핑한다 */
(function () {
  var input = document.querySelector('.hero-search input');
  var PHRASES = [
    '고객들에게 쿠폰을 보내고 싶어요',        /* 쿠폰발송 */
    '다음 주 세미나에 초대하고 싶어요',        /* 세미나 초대 */
    '신규 회원에게 가입 안내를 보내고 싶어요', /* 회원가입 */
    '문의하신 분들께 자료를 보내고 싶어요'     /* 자료발송 */
  ];

  var TYPE = 70, ERASE = 30, HOLD = 1800, GAP = 400, BLINK = 500;

  /* 모션을 줄이도록 설정한 사용자에겐 첫 문구만 고정으로 */
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    input.placeholder = PHRASES[0];
    return;
  }

  var text = '', caret = true, stopped = false;
  var blink = setInterval(function () { caret = !caret; paint(); }, BLINK);

  function paint() {
    if (!stopped) input.placeholder = text + (caret ? '|' : '\u00a0');
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function run() {
    var i = 0;
    while (!stopped) {
      var p = PHRASES[i % PHRASES.length];
      for (var n = 1; n <= p.length && !stopped; n++) { text = p.slice(0, n); paint(); await sleep(TYPE); }
      await sleep(HOLD);
      for (var m = p.length; m >= 0 && !stopped; m--) { text = p.slice(0, m); paint(); await sleep(ERASE); }
      await sleep(GAP);
      i++;
    }
  }
  run();

  /* 사용자가 입력을 시작하면 멈추고 고정 문구로 되돌린다 */
  input.addEventListener('focus', function () {
    stopped = true;
    clearInterval(blink);
    input.placeholder = PHRASES[0];
  }, { once: true });
})();

/* 카카오 배너를 닫으면 이용 가이드가 가로 배너로 펼쳐진다 */
(function () {
  var panel = document.querySelector('.panel-lilac');
  var close = panel && panel.querySelector('.panel-close');
  if (!close) return;

  close.addEventListener('click', function () {
    panel.classList.add('is-dismissing');
    panel.addEventListener('transitionend', function () {
      panel.remove();
      document.querySelector('.bottom').classList.add('is-solo');

      /* 가로 배너에서는 전체보기 버튼을 한 단계 작게 */
      var more = document.querySelector('.onboard-left .btn');
      more.classList.remove('btn-xl');
      more.classList.add('btn-md');
    }, { once: true });
  });
})();
</script>
</body>
</html>
