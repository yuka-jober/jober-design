<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연차 설정 — 자버</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
/* 원본: 디자인 캔버스 "연차 설정 개선안" › Main — 자버 디자인 시스템으로 다시 입힌 버전 */

/* ── 1. PAGE ─────────────────────────────── */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-base);
  font-size: var(--fs-14);
  line-height: var(--lh-base);
  letter-spacing: var(--ls-base);
  background: var(--color-page);
  color: var(--color-text);
  word-break: keep-all;
}
h1, h2, h3, p { margin: 0; }
button { font-family: inherit; }

.ls-wrap   { padding: 32px 20px 56px; }
.ls-layout { max-width: 1084px; margin: 0 auto; display: flex; gap: 24px; align-items: flex-start; }
.ls-main   { flex: 1; min-width: 0; max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.ls-sub      { font-size: var(--fs-12); color: var(--color-text-secondary); }
.ls-desc     { font-size: var(--fs-12); color: var(--color-text-secondary); }
.ls-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ls-chev     { display: flex; flex: none; color: var(--color-text-secondary); }

/* ── 2. 섹션 바로가기 (좌측) ─────────────── */
.ls-nav { position: sticky; top: 24px; flex: 0 0 180px; display: flex; flex-direction: column; gap: 4px; padding-top: 56px; }
.ls-navlink {
  height: var(--control-h-lg);
  padding: 0 var(--control-px);
  border: none;
  border-radius: var(--r-lg);
  background: transparent;
  text-align: left;
  font-size: var(--fs-14);
  font-weight: var(--fw-regular);
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: background-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.ls-navlink:hover { background: var(--color-bg-base); color: var(--color-text); }
.ls-navlink[aria-current="true"] { background: var(--color-surface); color: var(--color-primary); box-shadow: var(--shadow-1); }
.ls-navlink:focus-visible { outline: none; box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }
.ls-nav-dirty { margin-top: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 1120px) { .ls-nav { display: none; } }

/* ── 3. 헤더 ─────────────────────────────── */
.ls-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ls-header-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.ls-header-actions .btn { text-decoration: none; }

/* ── 4. 섹션 카드 ────────────────────────── */
.ls-section { padding: 0; scroll-margin-top: 16px; }
.ls-section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 32px;
  background: var(--color-surface-sub);
  border-bottom: 1px solid var(--color-border-split);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
}
.ls-section-icon {
  width: 32px;
  height: 32px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-lg);
  background: var(--color-accent-blue-bg);
  color: var(--color-accent-blue-fg);
}
.ls-section-body { padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; }
.ls-section-body.is-list { padding: 8px 32px; gap: 0; }
.ls-split { height: 1px; background: var(--color-border-split); }

/* 설정 한 줄 — 왼쪽 이름·설명, 오른쪽 컨트롤 */
.ls-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 8px 0; }
.ls-row + .ls-row { border-top: 1px solid var(--color-border-split); }
.ls-row.is-top { align-items: flex-start; flex-wrap: wrap; padding: 16px 0; }
.ls-row-text { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; min-width: 0; }
.ls-row-label { flex: 0 0 264px; max-width: 100%; display: flex; flex-direction: column; gap: 4px; }
.ls-row-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ls-row-end { display: flex; align-items: center; gap: 8px; flex: none; margin-left: auto; }

/* ── 5. 선택 카드 (라디오) ──────────────── */
.ls-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.ls-options.is-tight { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.ls-option {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--r-lg);
  background: var(--color-surface);
  cursor: pointer;
  transition: border-color var(--motion-standard) var(--ease-standard), background-color var(--motion-standard) var(--ease-standard);
}
.ls-option:hover { border-color: var(--color-primary-hover); }
.ls-option.is-selected { border-color: var(--color-primary); background: var(--color-primary-bg); }
.ls-option:has(.radio:focus-visible) { box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }
.ls-option-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.ls-option-note { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: var(--fs-12); color: var(--color-text-secondary); }
/* 글자까지 색을 입힌다. 기본 단계(-6)는 흰 바탕 글씨로 너무 옅어서 한 단계 진한 -active 를 쓴다 */
.ls-option-note.is-warning { color: var(--color-warning-active); }
.ls-option-note.is-success { color: var(--color-success-active); }
.ls-note-icon { display: flex; }

/* ── 6. 결재선 요약·패널 ────────────────── */
/* 요약 줄과 펼친 패널은 한 카드 — 펼치면 카드가 늘어나고 구분선 아래로 이어진다 */
.ls-co {
  border: 1px solid var(--color-border-split);
  border-radius: var(--r-xl);
  background: var(--color-surface-sub);
  transition: border-color var(--motion-standard) var(--ease-standard);
}
.ls-co:has(> .ls-summary:hover) { border-color: var(--color-border); }
.ls-summary {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 16px 8px 20px;
  border: none;
  border-radius: inherit;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.ls-summary[aria-expanded="true"] { border-end-start-radius: 0; border-end-end-radius: 0; }
.ls-summary:focus-visible { outline: none; box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }
.ls-summary-main { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-width: 0; }
.ls-vsep { width: 1px; height: 12px; flex: none; background: var(--color-border); }
.ls-arrow { display: flex; color: var(--color-disabled); }

.ls-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px;
  border-top: 1px solid var(--color-border-split);
}

/* 결재자 추가 드롭다운 */
.ls-picker { position: relative; }
.ls-dd {
  width: 100%;
  height: var(--control-h-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 var(--control-px);
  border: 1px solid var(--color-border);
  border-radius: var(--r-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-size: var(--fs-14);
  text-align: left;
  cursor: pointer;
  transition: border-color var(--motion-standard) var(--ease-standard), box-shadow var(--motion-standard) var(--ease-standard);
}
.ls-dd:hover { border-color: var(--color-primary-hover); }
.ls-dd[aria-expanded="true"],
.ls-dd:focus-visible { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }
.ls-dd .icon { color: var(--color-text-secondary); }
.ls-dd-menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 10; max-height: 320px; overflow-y: auto; }

/* 사람 한 줄 (메뉴·목록 공통 칸) */
.ls-menu-person { display: grid; grid-template-columns: 64px 52px minmax(0, 132px) minmax(0, 1fr) 76px; column-gap: 12px; }
.ls-people { border: 1px solid var(--color-border-split); border-radius: var(--r-lg); background: var(--color-surface); }
.ls-people-row { display: grid; align-items: center; column-gap: 12px; min-height: 52px; padding: 4px 4px 4px 12px; background: var(--color-surface); }
.ls-people-row:first-child { border-radius: var(--r-lg) var(--r-lg) 0 0; }
.ls-people-row:last-child  { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.ls-people-row + .ls-people-row { border-top: 1px solid var(--color-border-split); }
.ls-people-row.is-sel   { grid-template-columns: 20px 64px 52px minmax(0, 132px) minmax(0, 1fr) 76px 32px; }
.ls-people-row.is-order { grid-template-columns: 24px 64px 64px 52px minmax(0, 132px) minmax(0, 1fr) 76px 32px; padding-left: 4px; }
.ls-people-row.is-dragging { opacity: 0.45; }
.ls-people-row.is-over-top    { box-shadow: inset 0 2px 0 var(--color-primary); }
.ls-people-row.is-over-bottom { box-shadow: inset 0 -2px 0 var(--color-primary); }
.ls-handle { cursor: grab; }
.ls-num { font-variant-numeric: tabular-nums; }
.ls-empty { padding: 16px; font-size: var(--fs-14); color: var(--color-text-secondary); }

/* 실제 승인 과정 — 첫 칩 너비를 맞춰(--path-first-w, 그린 뒤 JS 가 잼) 화살표가 한 줄로 서게 한다 */
.ls-path {
  display: grid;
  grid-template-columns: 176px minmax(0, 1fr);
  column-gap: 12px;
  padding: 16px 20px;
  border-radius: var(--r-xl);
  background: var(--color-bg-base);
}
.ls-path-title { grid-column: 1 / -1; padding-bottom: 4px; font-weight: var(--fw-bold); }
.ls-path-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: baseline; padding: 12px 0; }
.ls-path-row + .ls-path-row { border-top: 1px solid var(--color-border-split); }
.ls-path-who  { color: var(--color-text-secondary); }
.ls-path-first { justify-content: center; min-width: var(--path-first-w, auto); }
/* 첫 칩부터 한 묶음으로 줄바꿈 — 넘친 줄은 첫 칩 아래에서 시작한다.
   라벨·첫 칩은 글자 기준선으로 맞춰 칩이 두 줄이 돼도 첫 줄에 붙는다 */
.ls-path-rest { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
/* 화살표는 뒤 칩과 한 묶음 — 줄이 넘어가도 화살표만 줄 끝에 남지 않는다 */
.ls-step { display: inline-flex; align-items: baseline; gap: 8px; }
.ls-step .ls-arrow { align-self: center; }
.ls-path-full { grid-column: 2 / -1; }
.ls-path-span { grid-column: 1 / -1; padding: 12px 0; color: var(--color-text-secondary); }
.ls-path-more { grid-column: 1 / -1; justify-self: start; padding: 0; }
.ls-chip-auto { background: var(--color-accent-purple-bg); color: var(--color-accent-purple-fg); }
.ls-chip-pick { background: var(--color-surface); border-color: var(--color-border); color: var(--color-text); }
.ls-note { display: inline-flex; padding: 4px 12px; border: 1px dashed var(--color-border); border-radius: var(--r-full); color: var(--color-text-secondary); }
@media (max-width: 640px) {
  .ls-path { grid-template-columns: minmax(0, 1fr); }
  .ls-path-row { row-gap: 8px; }
  .ls-path-full { grid-column: auto; }
}

/* ── 7. 부서별 결재선 ───────────────────── */
.ls-teams { display: flex; flex-direction: column; gap: 8px; }
.ls-team { border: 1px solid var(--color-primary-border); border-radius: var(--r-xl); background: var(--color-surface); }
.ls-team-head {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px 8px 20px;
  border: none;
  border-radius: var(--r-xl);
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}
.ls-team-head:hover { background: var(--color-bg-light); }
.ls-team-head:focus-visible { outline: none; box-shadow: 0 0 0 var(--outline-w) var(--color-primary-outline); }
.ls-team-meta { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.ls-team-body { display: flex; flex-direction: column; gap: 16px; padding: 16px 20px; border-top: 1px solid var(--color-border-split); }
.ls-team-body .segmented { flex-wrap: wrap; }
.ls-dept-item { display: grid; grid-template-columns: minmax(0, 1fr) 40px 1px minmax(0, 260px); column-gap: 12px; min-height: 48px; }
.ls-dept-item .ls-count { text-align: right; font-variant-numeric: tabular-nums; }
.ls-dept-item.is-configured .ls-dept-name { color: var(--color-text-secondary); }
.ls-dept-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ls-menu-foot { justify-content: center; border-top: 1px solid var(--color-border-split); color: var(--color-text-secondary); }

/* ── 8. 휴가 유형 칩 ────────────────────── */
.ls-chips { flex: 1 1 300px; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.segmented-item.is-hidden {
  background: var(--color-bg-base);
  border-color: var(--color-border-split);
  color: var(--color-disabled);
  text-decoration: line-through;
}

/* ── 9. 연동 ────────────────────────────── */
.ls-connected { display: inline-flex; align-items: center; gap: 8px; height: var(--control-h); padding: 0 var(--control-px); border-radius: var(--r-full); background: var(--color-bg-base); }
.ls-dot { width: 8px; height: 8px; flex: none; border-radius: var(--r-full); background: var(--color-success); }
.ls-cal-select { width: 200px; }

/* ── 10. 하단 버튼 · 다이얼로그 ─────────── */
.ls-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.ls-footer .ls-status { margin-right: auto; color: var(--color-text-secondary); }
.dialog-overlay { z-index: 50; }
</style>
</head>

<div id="app"></div>

<script>
/* ── 데이터 ──────────────────────────────── */
var M = {
  lee:  { name: '이동욱', role: '팀장',   email: 'neo@jober.io',     auth: '최고관리자' },
  kim:  { name: '김예원', role: '팀장',   email: 'harper@jober.io',  auth: '최고관리자' },
  park: { name: '박윤정', role: '팀원',   email: 'june@jober.io',    auth: '구성원' },
  jung: { name: '정하늘', role: '본부장', email: 'haneul@jober.io',  auth: '구성원' },
  oh:   { name: '오세진', role: '이사',   email: 'sejin@jober.io',   auth: '구성원' },
  neo:  { name: '이네오', role: '대표',   email: 'leo@jober.io',     auth: '최고관리자' },
  mun:  { name: '문종영', role: '',       email: 'moon@jober.io',    auth: '구성원' },
  hong: { name: '홍길동', role: '',       email: 'gildong@jober.io', auth: '구성원' },
  ra:   { name: '라민지', role: '',       email: 'riley@jober.io',   auth: '구성원' },
  yang: { name: '양은주', role: '',       email: 'eunju@jober.io',   auth: '구성원' }
};
var IDS = ['lee', 'kim', 'park', 'jung', 'oh', 'neo', 'mun', 'hong', 'ra', 'yang'];
var GUIDE_URL = 'https://jober.notion.site/f63b592d40d7436ca5cf28e464f38443';
var METHODS = [
  ['select', '선택 결재', '지정된 결재자 중 1명을 선택해요.'],
  ['direct', '직속 결재', '바로 위 결재자가 승인해요.', '1명 승인'],
  ['step',   '단계 결재', '상위 결재자들이 차례로 승인해요.', '순차 승인']
];
var NAV = [['policy', '기본 정책'], ['approval', '결재'], ['rules', '신청·승인 규칙'], ['view', '직원 화면'], ['types', '휴가 유형'], ['integ', '연동']];

function initial() {
  return {
    calc: 'hire',
    co: { method: 'select', sel: ['lee', 'kim'], order: ['park', 'lee', 'neo'] },
    selfBlock: true,
    depts: [
      { id: 'exec', name: '임원', members: ['neo'] },
      { id: 'biz', name: 'biz team', members: [] },
      { id: 'bx1', name: 'BX사업본부 BX1팀', members: ['kim', 'lee', 'park', 'ra', 'yang'] },
      { id: 'bx2', name: 'BX사업본부 BX2팀', members: [] },
      { id: 'dx', name: 'DX 기술연구소', members: ['jung', 'oh'] },
      { id: 'space', name: '공간비즈본부', members: [] },
      { id: 'mkt', name: '전략마케팅팀', members: [] },
      { id: 'creative', name: '크리에이티브팀', members: [] },
      { id: 'new1', name: '신사업1팀', members: [] },
      { id: 'media', name: '미디어팀', members: [] }
    ],
    deptOn: true,
    teams: [{ id: 'bx1', method: 'direct', sel: [], order: ['kim'] }],
    rules: { overLimit: true, sameDay: false, cancel: true, mineOnly: false, history: true },
    units: { full: true, amHalf: true, pmHalf: true, amQuarter: true, pmQuarter: true },
    hiddenLeave: ['extra'],
    gcal: { connected: true, email: 'neo@jober.io' }
  };
}

var state = {
  data: initial(), saved: '', justSaved: false, nav: 'policy',
  coOpen: false, teamOpen: null, showAll: {}, menu: null,
  addDept: false, addShowEmpty: false, gcalConfirm: false, confirm: false
};
state.saved = JSON.stringify(state.data);

/* ── 상태 갱신 ───────────────────────────── */
function set(patch) { Object.assign(state, patch); render(); }
function upd(fn, patch) {
  var d = JSON.parse(JSON.stringify(state.data));
  fn(d);
  state.data = d;
  state.justSaved = false;
  set(patch || {});
}
function lineOf(d, key) {
  if (key === 'co') return d.co;
  var id = key.slice(5);
  return d.teams.filter(function (t) { return t.id === id; })[0];
}
function teamOf(id) { return state.data.teams.filter(function (t) { return t.id === id; })[0]; }
function deptOf(x) {
  var hit = state.data.depts.filter(function (dp) { return dp.members.indexOf(x) >= 0; })[0];
  return hit ? hit.name : '부서 없음';
}
function josa(name) {
  var c = name.charCodeAt(name.length - 1) - 0xAC00;
  return (c >= 0 && c <= 11171 && c % 28 !== 0) ? '이' : '가';
}

/* ── 렌더 도우미 ─────────────────────────── */
var H = [], K = [];
// 클릭 핸들러를 등록하고 data 속성을 돌려준다. fid 는 다시 그린 뒤 포커스를 되돌릴 자리
function act(fn, fid) { H.push(fn); return 'data-h="' + (H.length - 1) + '"' + (fid ? ' data-fid="' + fid + '"' : ''); }
function ic(id, cls) { return '<svg class="icon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"></use></svg>'; }
function authBadge(a) { return '<span class="badge badge-sm ' + (a === '최고관리자' ? 'badge-weak-primary' : 'badge-weak-success') + '">' + a + '</span>'; }
function personCells(x) {
  var p = M[x];
  return '<span class="font-medium ls-ellipsis">' + p.name + '</span>' +
    '<span class="ls-sub">' + (p.role || '-') + '</span>' +
    '<span class="ls-sub ls-ellipsis">' + deptOf(x) + '</span>' +
    '<span class="ls-sub ls-ellipsis">' + p.email + '</span>' +
    '<span>' + authBadge(p.auth) + '</span>';
}
function toggle(label, on, fn, fid) {
  return '<input type="checkbox" role="switch" class="toggle" aria-label="' + label + '"' + (on ? ' checked' : '') + ' ' + act(fn, fid) + '>';
}
function chev(open) { return '<span class="ls-chev">' + ic(open ? 'up-outlined' : 'down-outlined') + '</span>'; }
var CHIP = { auto: 'ls-chip-auto', pick: 'ls-chip-pick', final: 'badge-fill-primary', done: 'badge-weak-primary' };
function chip(s, first) { return '<span class="badge badge-lg badge-pill ' + CHIP[s.kind] + (first ? ' ls-path-first' : '') + '">' + s.label + '</span>'; }
function sectionHead(icon, title) {
  return '<h2 class="ls-section-head text-16 font-bold"><span class="ls-section-icon">' + ic(icon) + '</span>' + title + '</h2>';
}

/* ── 승인 경로 계산 ─────────────────────── */
function pathRows(L, key) {
  var d = state.data, cur = L.method, isSel = cur === 'select', n = L.order.length;
  var isDept = key.indexOf('team:') === 0, rows = [];
  var C = function (label, kind) { return { label: label, kind: kind }; };
  var escalate = function (applicant, selStyle) {
    var co = d.co, sb = d.selfBlock;
    var done = selStyle ? C('승인', 'final') : C('완료', 'done');
    if (co.method === 'select') {
      var pool = co.sel.filter(function (x) { return !(sb && x === applicant); });
      if (!pool.length) return { steps: [], warn: true, note: '기본 결재선에 승인할 다른 결재자가 없어요. 결재자를 추가하거나 제한을 꺼 주세요.' };
      var lab = pool.length === 1 ? M[pool[0]].name + (selStyle ? ' 자동 지정' : ' 승인')
        : (pool.length > 3 ? '결재자 ' + pool.length + '명' : pool.map(function (x) { return M[x].name; }).join(' / ')) + ' 중 선택';
      return { steps: [C('기본 결재선 · ' + lab, 'auto'), done] };
    }
    var ord = co.order;
    if (!ord.length) return { steps: [], warn: true, note: '기본 결재선에 결재자가 없어요. 기본 결재선을 먼저 설정해 주세요.' };
    var fin = ord[ord.length - 1];
    if (sb && fin === applicant) return { steps: [], warn: true, note: '기본 결재선의 최종 결재자도 본인이라 승인할 사람이 없어요.' };
    return { steps: [C('기본 결재선 · ' + M[fin].name + (selStyle ? ' 자동 지정' : ' 승인'), 'auto'), done] };
  };

  if (isSel) {
    var sel = L.sel, sb = d.selfBlock, ns = sel.length;
    var pickLabel = function (list) {
      return (list.length > 3 ? '결재자 ' + list.length + '명' : list.map(function (x) { return M[x].name; }).join(' / ')) + ' 중 선택';
    };
    var flow = function (first, kind) { return { steps: [C(first, kind), C('승인', 'final')] }; };
    if (ns > 0) {
      var f0 = ns === 1 ? flow(M[sel[0]].name + ' 자동 지정', 'auto') : flow(pickLabel(sel), 'pick');
      rows.push({ who: '직원이 신청하면', steps: f0.steps });
      var c;
      if (sb) {
        if (ns === 1 && isDept) c = escalate(sel[0], true);
        else if (ns === 1) c = { steps: [], warn: true, note: '승인할 다른 결재자가 없어요. 결재자를 추가하거나 제한을 꺼 주세요.' };
        else if (ns === 2) c = flow('다른 결재자 자동 지정', 'auto');
        else c = flow('본인 제외 결재자 중 선택', 'pick');
      } else {
        c = ns === 1 ? flow('본인 자동 지정', 'auto') : flow('본인 포함 결재자 중 선택', 'pick');
      }
      rows.push(Object.assign({ who: '연차 결재자가 신청하면' }, c));
    }
  } else if (n > 0) {
    var whoOf = function (id) {
      var p = M[id], last = p.role || p.name;
      return (p.role ? p.name + ' ' + p.role : p.name) + josa(last) + ' 신청하면';
    };
    var chain = function (start) {
      var ch = cur === 'direct' ? [L.order[start]] : L.order.slice(start);
      return ch.map(function (id) { return C(M[id].name + ' 승인', 'pick'); }).concat([C('완료', 'done')]);
    };
    rows.push({ who: '직원이 신청하면', steps: chain(0) });
    L.order.forEach(function (id, i) {
      if (i + 1 < n) rows.push({ who: whoOf(id), steps: chain(i + 1) });
      else if (isDept) rows.push(Object.assign({ who: whoOf(id) }, escalate(id)));
      else rows.push({ who: whoOf(id), steps: [], note: d.selfBlock ? '상위 결재자가 없어 본인을 제외한 결재자 중 1명을 선택해요' : '상위 결재자가 없어 본인 포함 결재자 중 1명을 선택해요' });
    });
  }
  return rows;
}

function pathHTML(L, key) {
  var rows = pathRows(L, key);
  var count = (L.method === 'select' ? L.sel : L.order).length;
  var long = count >= 5, expanded = !!state.showAll[key];
  var vis = long && !expanded ? rows.slice(0, 4) : rows;
  var h = '<div class="ls-path"><div class="ls-path-title">' + (key === 'co' ? '실제 승인 과정' : '이 부서의 승인 과정') + '</div>';
  if (!rows.length) h += '<div class="ls-path-span">결재자를 추가하면 승인 경로가 보여요.</div>';
  vis.forEach(function (r) {
    h += '<div class="ls-path-row"><span class="ls-path-who">' + r.who + '</span>';
    if (!r.steps.length) {
      h += '<div class="ls-path-full">' + (r.warn
        ? '<div class="alert alert-warning">' + ic('exclamation-circle-filled', 'alert-icon') + '<span>' + r.note + '</span></div>'
        : '<span class="ls-note">' + r.note + '</span>') + '</div>';
    } else {
      h += '<span class="ls-path-rest">' + chip(r.steps[0], true) + r.steps.slice(1).map(function (s) {
        return '<span class="ls-step"><span class="ls-arrow">' + ic('arrow-right-outlined', 'icon-sm') + '</span>' + chip(s) + '</span>';
      }).join('') + '</span>';
    }
    h += '</div>';
  });
  if (long) {
    h += '<button type="button" class="btn btn-link btn-md ls-path-more" ' + act(function () {
      state.showAll[key] = !expanded; render();
    }, 'more-' + key) + '>' + (expanded ? '접기' : '전체 승인 경로 보기 (' + rows.length + '개)') + '</button>';
  }
  return h + '</div>';
}

/* ── 결재선 편집 (회사 기본 · 부서 전용 공통) ── */
function lineHTML(L, key, pool) {
  var isSel = L.method === 'select', list = isSel ? L.sel : L.order;
  var menuOpen = !!state.menu && state.menu.key === key;
  var h = '<div class="ls-picker">';
  h += '<button type="button" class="ls-dd" aria-expanded="' + menuOpen + '" ' + act(function () {
    set({ menu: menuOpen ? null : { key: key } });
  }, 'dd-' + key) + '><span>결재자 추가' + (isSel ? '' : ' <span class="text-secondary">· 하위 결재자부터 순서대로</span>') + '</span>' + ic('down-outlined') + '</button>';
  if (menuOpen) {
    var items = (pool || IDS).filter(function (x) { return list.indexOf(x) < 0; });
    h += '<div class="menu ls-dd-menu">';
    h += items.length ? items.map(function (x) {
      return '<button type="button" class="menu-item ls-menu-person" ' + act(function () {
        upd(function (d) { var LL = lineOf(d, key); (isSel ? LL.sel : LL.order).push(x); }, { menu: null });
      }) + '>' + personCells(x) + '</button>';
    }).join('') : '<div class="menu-header">추가할 수 있는 직원이 없어요.</div>';
    h += '</div>';
  }
  h += '</div>';

  h += '<div class="ls-people">';
  if (!list.length) h += '<div class="ls-empty">아직 결재자가 없어요. 위에서 추가해 주세요.</div>';
  list.forEach(function (id, i) {
    var remove = act(function () {
      upd(function (d) { var LL = lineOf(d, key); (isSel ? LL.sel : LL.order).splice(i, 1); }, { menu: null });
    });
    var removeBtn = '<button type="button" class="icon-btn" aria-label="' + M[id].name + (isSel ? ' 결재자에서 삭제' : ' 결재선에서 삭제') + '" ' + remove + '>' + ic('close-outlined') + '</button>';
    if (isSel) {
      h += '<div class="ls-people-row is-sel"><span class="ls-sub ls-num">' + (i + 1) + '</span>' + personCells(id) + removeBtn + '</div>';
    } else {
      K.push(function (e) {
        var j = e.key === 'ArrowUp' ? i - 1 : e.key === 'ArrowDown' ? i + 1 : -1;
        if (j < 0 || j >= list.length) return;
        e.preventDefault();
        upd(function (d) { var a = lineOf(d, key).order, t = a[i]; a[i] = a[j]; a[j] = t; }, { menu: null });
      });
      h += '<div class="ls-people-row is-order" draggable="true" data-dr="' + i + '" data-drk="' + key + '">' +
        '<button type="button" class="icon-btn icon-btn-sm ls-handle" aria-label="' + M[id].name + ' 순서 변경 (위·아래 방향키)" data-key="' + (K.length - 1) + '" data-fid="h-' + key + '-' + id + '">' + ic('menu-outlined') + '</button>' +
        '<span><span class="badge badge-sm badge-weak-neutral ls-num">' + (L.method === 'step' ? (i + 1) + '단계' : '결재자 ' + (i + 1)) + '</span></span>' +
        personCells(id) + removeBtn + '</div>';
    }
  });
  h += '</div>';
  return h + pathHTML(L, key);
}

function methodCards(L, key) {
  return '<div class="ls-options is-tight">' + METHODS.map(function (m) {
    var on = L.method === m[0];
    return '<label class="ls-option' + (on ? ' is-selected' : '') + '">' +
      '<span class="ls-option-head"><input type="radio" class="radio" name="method-' + key + '"' + (on ? ' checked' : '') + ' ' +
      act(function () { upd(function (d) { lineOf(d, key).method = m[0]; }, { menu: null }); }, 'm-' + key + '-' + m[0]) + '>' +
      '<span class="text-14 font-medium">' + m[1] + '</span>' +
      (m[3] ? '<span class="badge badge-sm badge-weak-neutral">' + m[3] + '</span>' : '') + '</span>' +
      '<span class="ls-desc">' + m[2] + '</span></label>';
  }).join('') + '</div>';
}

function teamHTML(dp, t) {
  var open = state.teamOpen === dp.id, key = 'team:' + dp.id;
  var names = (t.method === 'select' ? t.sel : t.order).map(function (id) { return M[id].name; });
  var summary = !names.length ? '결재자 없음'
    : t.method === 'step' ? names.join(' → ')
    : names.length === 1 ? names[0] + ' 승인'
    : t.method === 'select' ? names.join(' / ') + ' 중 1명 승인'
    : names.join(' · ') + ' 중 바로 위 1명 승인';
  var methodLabel = METHODS.filter(function (m) { return m[0] === t.method; })[0][1];
  var h = '<div class="ls-team">';
  h += '<button type="button" class="ls-team-head" aria-expanded="' + open + '" ' + act(function () {
    set({ teamOpen: open ? null : dp.id, menu: null });
  }, 'team-' + dp.id) + '><span class="ls-team-meta">' +
    '<span class="badge badge-md badge-weak-primary">부서 전용</span>' +
    '<span class="font-medium ls-ellipsis">' + dp.name + '</span><span class="ls-sub">(' + dp.members.length + '명)</span>' +
    '<span class="ls-vsep" aria-hidden="true"></span>' +
    '<span class="badge badge-md badge-weak-neutral">' + methodLabel + '</span>' +
    '<span class="ls-ellipsis">' + summary + '</span></span>' + chev(open) + '</button>';
  if (open) {
    h += '<div class="ls-team-body"><div class="segmented" role="group" aria-label="결재 방식">' + METHODS.map(function (m) {
      var on = t.method === m[0];
      return '<button type="button" class="segmented-item' + (on ? ' is-selected' : '') + '" aria-pressed="' + on + '" ' +
        act(function () { upd(function (d) { lineOf(d, key).method = m[0]; }, { menu: null }); }, 'tm-' + dp.id + '-' + m[0]) + '>' + m[1] + '</button>';
    }).join('') + '</div>';
    h += lineHTML(t, key, dp.members);
    h += '<div><button type="button" class="btn btn-text btn-md is-danger" ' + act(function () {
      upd(function (d) { d.teams = d.teams.filter(function (y) { return y.id !== dp.id; }); }, { teamOpen: null, menu: null });
    }) + '>전용 결재선 삭제</button></div></div>';
  }
  return h + '</div>';
}

function addDeptHTML() {
  var d = state.data, open = state.addDept;
  var item = function (dp) {
    var t = teamOf(dp.id);
    var names = dp.members.map(function (id) { return M[id].name; });
    var people = !names.length ? '' : names.length <= 3 ? names.join(' · ') : names.slice(0, 3).join(' · ') + ' 외 ' + (names.length - 3) + '명';
    return '<button type="button" class="menu-item ls-dept-item' + (t ? ' is-configured' : '') + '" aria-label="' + dp.name + ' ' + dp.members.length + '명' + (t ? ', 설정 완료, 기존 결재선 열기' : ', 전용 결재선 만들기') + '" ' + act(function () {
      if (!t) upd(function (x) { x.teams.push({ id: dp.id, method: 'direct', sel: [], order: [] }); }, { addDept: false, teamOpen: dp.id, menu: null });
      else set({ addDept: false, teamOpen: dp.id, menu: null });
    }) + '><span class="ls-dept-name"><span class="font-medium ls-ellipsis">' + dp.name + '</span>' +
      (t ? '<span class="badge badge-sm badge-weak-primary">설정 완료</span>' : '') + '</span>' +
      '<span class="ls-sub ls-count">' + dp.members.length + '명</span>' +
      '<span class="ls-vsep"' + (people ? '' : ' style="visibility: hidden"') + ' aria-hidden="true"></span>' +
      '<span class="ls-sub ls-ellipsis">' + people + '</span></button>';
  };
  var filled = d.depts.filter(function (dp) { return dp.members.length > 0; });
  var empty = d.depts.filter(function (dp) { return dp.members.length === 0; });
  var h = '<div class="ls-picker"><button type="button" class="btn btn-dashed btn-lg btn-block" aria-expanded="' + open + '" ' +
    act(function () { set({ addDept: !open }); }, 'add-dept') + '>' + ic('plus-outlined') + '부서 결재선 추가</button>';
  if (open) {
    h += '<div class="menu ls-dd-menu">' + filled.map(item).join('');
    if (empty.length) {
      if (state.addShowEmpty) h += empty.map(item).join('');
      h += '<button type="button" class="menu-item ls-menu-foot" aria-expanded="' + state.addShowEmpty + '" ' + act(function () {
        set({ addShowEmpty: !state.addShowEmpty });
      }, 'empty-depts') + '>' + (state.addShowEmpty ? '직원 없는 부서 접기' : '직원 없는 부서 ' + empty.length + '개 보기') + ic(state.addShowEmpty ? 'up-outlined' : 'down-outlined', 'icon-sm') + '</button>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

/* ── 섹션 ────────────────────────────────── */
function secPolicy() {
  var d = state.data;
  var defs = [
    ['hire', '입사연도 기준', '입사일 기준으로 계산해요.', false],
    ['fiscal', '회계연도 기준', '전 직원을 회계연도로 계산해요.', true],
    ['fiscalPre', '회계연도 (사전 부여)', '입사 첫해 월차를 미리 줘요.', true]
  ];
  return '<section id="sec-policy" class="card ls-section">' + sectionHead('calendar-outlined', '기본 정책') +
    '<div class="ls-section-body"><h3 class="text-14 font-bold">연차 산정 방식</h3><div class="ls-options">' +
    defs.map(function (c) {
      var on = d.calc === c[0];
      return '<label class="ls-option' + (on ? ' is-selected' : '') + '">' +
        '<span class="ls-option-head"><input type="radio" class="radio" name="calc"' + (on ? ' checked' : '') + ' ' +
        act(function () { upd(function (x) { x.calc = c[0]; }); }, 'calc-' + c[0]) + '><span class="text-14 font-medium">' + c[1] + '</span></span>' +
        '<span class="ls-desc">' + c[2] + '</span>' +
        (c[3]
          ? '<span class="ls-option-note is-warning"><span class="ls-note-icon">' + ic('exclamation-circle-outlined', 'icon-sm') + '</span>취업규칙 변경이 필요해요</span>'
          : '<span class="ls-option-note is-success"><span class="ls-note-icon">' + ic('check-circle-outlined', 'icon-sm') + '</span>별도 절차 없이 쓸 수 있어요</span>') +
        '</label>';
    }).join('') + '</div></div></section>';
}

function secApproval() {
  var d = state.data, co = d.co;
  var names = (co.method === 'select' ? co.sel : co.order).map(function (id) { return M[id].name; });
  var isStep = co.method === 'step', n = names.length;
  var sumLabel = isStep ? n + '단계 결재선' : '연차 결재자';
  var tail = n === 0 ? '아직 지정되지 않았어요' : n < 2 ? '' : co.method === 'select' ? '중 1명이 승인' : co.method === 'direct' ? '중 바로 위 1명이 승인' : '순차 승인';
  var deptOn = d.deptOn !== false;

  var h = '<section id="sec-approval" class="card ls-section">' + sectionHead('check-circle-outlined', '결재') + '<div class="ls-section-body">';

  h += '<div class="ls-row" style="padding: 0; min-height: 0"><div class="ls-row-title"><h3 class="text-14 font-bold">셀프 승인 제한</h3>' +
    '<span class="ls-desc">결재 권한이 있어도 본인이 신청한 연차는 승인할 수 없어요.</span></div>' +
    toggle('셀프 승인 제한', d.selfBlock, function () { upd(function (x) { x.selfBlock = !x.selfBlock; }); }, 'self') + '</div>';

  h += '<div class="ls-split"></div>';
  h += '<div class="ls-row-title"><h3 class="text-14 font-bold">회사 기본 결재선</h3><p class="ls-desc">우리 회사에 맞는 결재 방식을 선택해 주세요.</p></div>';
  h += methodCards(co, 'co');

  h += '<div class="ls-co"><button type="button" class="ls-summary" aria-expanded="' + state.coOpen + '" ' + act(function () {
    set({ coOpen: !state.coOpen, menu: null });
  }, 'co-summary') + '><span class="ls-summary-main">' +
    '<span class="text-secondary">' + sumLabel + (isStep ? '' : ' <span class="font-medium">' + n + '명</span>') + '</span>' +
    '<span class="ls-vsep" aria-hidden="true"></span>' +
    names.map(function (nm, i) {
      return (isStep && i > 0 ? '<span class="ls-arrow">' + ic('arrow-right-outlined', 'icon-sm') + '</span>' : '') +
        '<span class="badge badge-md badge-pill ls-chip-pick">' + nm + '</span>';
    }).join('') +
    (tail ? '<span class="text-secondary">' + tail + '</span>' : '') +
    '</span>' + chev(state.coOpen) + '</button>';

  if (state.coOpen) h += '<div class="ls-panel">' + lineHTML(co, 'co') + '</div>';
  h += '</div>';

  h += '<div class="ls-split"></div>';
  h += '<div class="ls-row" style="padding: 0; flex-wrap: wrap"><div class="ls-row-title" style="flex: 1 1 240px"><h3 class="text-14 font-bold">부서별 결재선</h3>' +
    '<p class="ls-desc">' + (deptOn ? '전용 결재선이 없는 부서는 기본 결재선을 사용해요.' : '필요한 부서에만 전용 결재선을 설정할 수 있어요.') + '</p></div>' +
    '<div class="ls-row-end">' +
    (deptOn ? '<a href="#" class="btn btn-default btn-md">조직도 편집' + ic('export-outlined', 'icon-sm') + '</a>' : '') +
    toggle('부서별 결재선', deptOn, function () { upd(function (x) { x.deptOn = x.deptOn === false; }, { addDept: false }); }, 'dept') +
    '</div></div>';

  if (deptOn) {
    h += '<div class="ls-teams">';
    d.depts.forEach(function (dp) { var t = teamOf(dp.id); if (t) h += teamHTML(dp, t); });
    h += addDeptHTML() + '</div>';
  }
  return h + '</div></section>';
}

function toggleRows(list) {
  return list.map(function (g) {
    return '<div class="ls-row"><div class="ls-row-text"><span class="ls-row-label text-14 font-medium">' + g[0] + '</span>' +
      '<span class="ls-desc">' + g[1] + '</span></div>' + toggle(g[0], g[2], g[3], g[4]) + '</div>';
  }).join('');
}
function flipRule(k) { return function () { upd(function (x) { x.rules[k] = !x.rules[k]; }); }; }

function secRules() {
  var r = state.data.rules;
  return '<section id="sec-rules" class="card ls-section">' + sectionHead('unordered-list-outlined', '신청·승인 규칙') +
    '<div class="ls-section-body is-list">' + toggleRows([
      ['잔여 연차 초과 신청 제한', '남은 연차보다 많이 신청할 수 없어요.', r.overLimit, flipRule('overLimit'), 'r-over'],
      ['당일 연차 신청 제한', '오늘 날짜의 연차 신청을 제한해요.', r.sameDay, flipRule('sameDay'), 'r-same'],
      ['승인된 연차 취소 요청 허용', '관리자가 승인하면 연차가 취소돼요.', r.cancel, flipRule('cancel'), 'r-cancel']
    ]) + '</div></section>';
}

function secView() {
  var r = state.data.rules;
  return '<section id="sec-view" class="card ls-section">' + sectionHead('desktop-outlined', '직원 화면') +
    '<div class="ls-section-body is-list">' + toggleRows([
      ['전체 일정에서 다른 직원의 연차 숨기기', '연차 결재자는 모든 직원의 연차를 볼 수 있어요.', r.mineOnly, flipRule('mineOnly'), 'v-mine'],
      ['직원에게 휴가기록 표시', '연도별 휴가 부여·사용 내역을 보여줘요.', r.history, flipRule('history'), 'v-hist']
    ]) + '</div></section>';
}

function secTypes() {
  var d = state.data;
  var units = [['full', '종일'], ['amHalf', '오전 반차'], ['pmHalf', '오후 반차'], ['amQuarter', '오전 반반차'], ['pmQuarter', '오후 반반차']];
  var onCount = units.filter(function (u) { return d.units[u[0]]; }).length;
  var leaves = [['annual', '연차'], ['health', '보건'], ['family', '경조사'], ['disaster', '재난'], ['special', '특별'], ['substitute', '대체'], ['home', '재택 근무'], ['remote', '원격 근무'], ['unpaid', '무급'], ['official', '공가'], ['subwork', '대체 근무'], ['extra', '연차 추가 부여'], ['leave', '휴직'], ['trip', '출장 근무']];
  var hiddenCount = d.hiddenLeave.length;
  var isHidden = function (t) { return d.hiddenLeave.indexOf(t[0]) >= 0; };

  return '<section id="sec-types" class="card ls-section">' + sectionHead('tag-outlined', '휴가 유형') +
    '<div class="ls-section-body is-list">' +
    '<div class="ls-row is-top"><div class="ls-row-label"><span class="text-14 font-medium">연차 신청 단위</span><span class="ls-desc">직원이 신청할 수 있는 연차 단위예요.</span></div>' +
    '<div class="ls-chips">' + units.map(function (u) {
      var on = !!d.units[u[0]];
      return '<button type="button" class="segmented-item' + (on ? ' is-selected' : '') + '" aria-pressed="' + on + '" ' + act(function () {
        if (on && onCount === 1) return;
        upd(function (x) { x.units[u[0]] = !x.units[u[0]]; });
      }, 'u-' + u[0]) + '>' + (on ? ic('check-outlined', 'icon-sm') : '') + u[1] + '</button>';
    }).join('') + '</div></div>' +
    '<div class="ls-row is-top"><div class="ls-row-label"><span class="text-14 font-medium" style="display: flex; align-items: center; gap: 8px">직원에게 숨길 유형' +
    (hiddenCount ? '<span class="badge badge-sm badge-weak-neutral">' + hiddenCount + '개 숨김</span>' : '') + '</span>' +
    '<span class="ls-desc">선택한 유형은 직원 신청 화면에서 숨겨져요.</span></div>' +
    '<div class="ls-chips">' + leaves.map(function (t) {
      var hid = isHidden(t);
      return '<button type="button" class="segmented-item' + (hid ? ' is-hidden' : '') + '" aria-pressed="' + hid + '" aria-label="' + t[1] + (hid ? ' 숨김 해제' : ' 숨기기') + '" ' + act(function () {
        upd(function (x) { var i = x.hiddenLeave.indexOf(t[0]); if (i >= 0) x.hiddenLeave.splice(i, 1); else x.hiddenLeave.push(t[0]); });
      }, 'l-' + t[0]) + '>' + t[1] + '</button>';
    }).join('') + '</div></div>' +
    '</div></section>';
}

function secInteg() {
  var g = state.data.gcal;
  var right = g.connected
    ? '<span class="ls-connected"><span class="ls-dot" aria-hidden="true"></span>' + g.email + '</span>' +
      '<label class="input-affix has-start has-end ls-cal-select">' +
      '<span class="input-affix-start">' + ic('calendar-outlined') + '</span>' +
      '<select class="select" aria-label="일정을 표시할 Google 캘린더"><option>0. 휴가·재택</option></select>' +
      '<span class="input-affix-end">' + ic('down-outlined', 'icon-sm') + '</span></label>' +
      '<button type="button" class="btn btn-text btn-md is-danger" ' + act(function () { set({ gcalConfirm: true }); }, 'gcal-off') + '>연결 해제</button>'
    : '<button type="button" class="btn btn-default btn-md" ' + act(function () { upd(function (x) { x.gcal.connected = true; }); }, 'gcal-on') + '>' + ic('google-outlined') + 'Google 캘린더 연결</button>';
  return '<section id="sec-integ" class="card ls-section">' + sectionHead('link-outlined', '연동') +
    '<div class="ls-section-body is-list"><div class="ls-row" style="flex-wrap: wrap">' +
    '<div class="ls-row-label"><span class="text-14 font-medium">Google 캘린더 연동</span><span class="ls-desc">연차관리 일정을 Google 캘린더에 표시해요.</span></div>' +
    '<div class="ls-row-end" style="flex-wrap: wrap; justify-content: flex-end">' + right + '</div></div></div></section>';
}

function dialog(id, title, desc, cancelFn, okLabel, okFn, danger) {
  return '<div class="dialog-overlay is-open"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="' + id + '">' +
    '<p class="dialog-title" id="' + id + '">' + title + '</p>' + (desc ? '<p class="dialog-desc">' + desc + '</p>' : '') +
    '<div class="dialog-actions"><button type="button" class="btn btn-default btn-md" ' + act(cancelFn, id + '-cancel') + '>취소</button>' +
    '<button type="button" class="btn btn-primary btn-md' + (danger ? ' is-danger' : '') + '" ' + act(okFn, id + '-ok') + '>' + okLabel + '</button></div></div></div>';
}

/* ── 전체 화면 ───────────────────────────── */
function apply() {
  var prev = JSON.parse(state.saved), cur = state.data;
  var changed = prev.co.method !== cur.co.method || JSON.stringify(prev.co.sel) !== JSON.stringify(cur.co.sel) || JSON.stringify(prev.co.order) !== JSON.stringify(cur.co.order);
  if (changed) return set({ confirm: true });
  set({ saved: JSON.stringify(cur), justSaved: true });
}

function view() {
  var dirty = JSON.stringify(state.data) !== state.saved;
  var status = dirty ? '저장하지 않은 변경 사항이 있어요.' : state.justSaved ? '저장했어요.' : '';

  var nav = '<nav class="ls-nav" aria-label="설정 바로가기">' + NAV.map(function (n) {
    var cur = state.nav === n[0];
    return '<button type="button" class="ls-navlink" aria-current="' + cur + '" ' + act(function () {
      set({ nav: n[0] });
      // 다시 그린 뒤에 찾는다 — 그리기 전 요소는 화면에서 빠져 스크롤이 안 된다
      var el = document.getElementById('sec-' + n[0]);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 'nav-' + n[0]) + '>' + n[1] + '</button>';
  }).join('') +
    (dirty ? '<div class="card ls-nav-dirty"><span class="ls-desc">저장하지 않은 변경사항이 있어요.</span>' +
      '<button type="button" class="btn btn-primary btn-md btn-block" ' + act(apply, 'nav-apply') + '>적용하기</button></div>' : '') +
    '</nav>';

  var header = '<header class="ls-header"><h1 class="text-24 font-bold" style="letter-spacing: var(--ls-tight)">연차 설정</h1>' +
    (dirty ? '<span class="badge badge-md badge-pill badge-weak-warning">저장 전</span>' : '') +
    '<div class="ls-header-actions">' +
    '<a class="btn btn-default btn-lg btn-pill" href="' + GUIDE_URL + '" target="_blank" rel="noopener noreferrer">' + ic('book-outlined') + '연차 가이드 보기</a>' +
    '<a class="btn btn-default btn-lg btn-pill" href="https://joberio.channel.io/home" target="_blank" rel="noopener noreferrer">' + ic('message-outlined') + '연차 문의하기</a>' +
    '</div></header>';

  var footer = '<footer class="ls-footer">' + (status ? '<span class="ls-status">' + status + '</span>' : '') +
    '<button type="button" class="btn btn-default btn-lg"' + (dirty ? '' : ' disabled') + ' ' + act(function () {
      set({ data: JSON.parse(state.saved), menu: null, justSaved: false });
    }, 'cancel') + '>취소</button>' +
    '<button type="button" class="btn btn-primary btn-lg"' + (dirty ? '' : ' disabled') + ' ' + act(apply, 'apply') + '>적용하기</button></footer>';

  var dialogs = '';
  if (state.gcalConfirm) dialogs += dialog('gcal-dlg', 'Google 캘린더 연결을 해제할까요?', '해제하면 연차관리 일정이 더 이상 Google 캘린더에 표시되지 않아요.',
    function () { set({ gcalConfirm: false }); }, '연결 해제',
    function () { upd(function (x) { x.gcal.connected = false; }, { gcalConfirm: false }); }, true);
  if (state.confirm) dialogs += dialog('save-dlg', '회사 기본 결재선을 변경하면 전용 결재선이 없는 부서에도 반영됩니다. 저장하시겠습니까?', '',
    function () { set({ confirm: false }); }, '변경사항 저장',
    function () { set({ confirm: false, saved: JSON.stringify(state.data), justSaved: true }); });

  return '<div class="ls-wrap"><div class="ls-layout">' + nav +
    '<div class="ls-main">' + header + secPolicy() + secApproval() + secRules() + secView() + secTypes() + secInteg() + footer + '</div>' +
    '</div></div>' + dialogs;
}

/* ── 그리기 · 이벤트 ─────────────────────── */
var app = document.getElementById('app');
function render() {
  var a = document.activeElement, fid = a && a.dataset ? a.dataset.fid : null;
  H = []; K = [];
  app.innerHTML = view();
  alignPaths();
  if (fid) {
    var el = app.querySelector('[data-fid="' + fid + '"]');
    if (el) el.focus({ preventScroll: true });
  }
}

// 승인 과정마다 가장 넓은 첫 칩 너비로 나머지 첫 칩을 맞춘다 — 두 번째 칩 앞 화살표가 세로로 선다
function alignPaths() {
  app.querySelectorAll('.ls-path').forEach(function (p) {
    p.style.removeProperty('--path-first-w');
    var w = 0;
    p.querySelectorAll('.ls-path-first').forEach(function (c) { w = Math.max(w, c.offsetWidth); });
    if (w) p.style.setProperty('--path-first-w', w + 'px');
  });
}
// 웹폰트가 늦게 오면 칩 너비가 바뀌므로 다시 잰다
if (document.fonts) document.fonts.ready.then(alignPaths);

app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-h]');
  if (el && !el.disabled) H[+el.dataset.h](e);
});
app.addEventListener('keydown', function (e) {
  var el = e.target.closest('[data-key]');
  if (el) K[+el.dataset.key](e);
});

// 드래그 중에는 다시 그리지 않는다 — 끌던 줄이 사라지면 드래그가 끊긴다
var drag = null;
function clearOver() {
  app.querySelectorAll('.is-over-top, .is-over-bottom').forEach(function (r) { r.classList.remove('is-over-top', 'is-over-bottom'); });
}
app.addEventListener('dragstart', function (e) {
  var row = e.target.closest('[data-dr]');
  if (!row) return;
  drag = { key: row.dataset.drk, from: +row.dataset.dr };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
  row.classList.add('is-dragging');
});
app.addEventListener('dragover', function (e) {
  var row = e.target.closest('[data-dr]');
  if (!drag || !row || row.dataset.drk !== drag.key) return;
  e.preventDefault();
  clearOver();
  var to = +row.dataset.dr;
  if (to !== drag.from) row.classList.add(drag.from > to ? 'is-over-top' : 'is-over-bottom');
});
app.addEventListener('drop', function (e) {
  var row = e.target.closest('[data-dr]');
  if (!drag || !row || row.dataset.drk !== drag.key) return;
  e.preventDefault();
  var from = drag.from, to = +row.dataset.dr, key = drag.key;
  drag = null;
  if (from !== to) upd(function (d) { var a = lineOf(d, key).order; var x = a.splice(from, 1)[0]; a.splice(to, 0, x); }, { menu: null });
  else render();
});
app.addEventListener('dragend', function () {
  if (!drag) return;
  drag = null;
  render();
});

render();
</script>
</body>
</html>
