<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>카카오 채널 연동</title>
<style>
  :root {
    --brand: #1a76ff;
    --brand-hover: #0f66e8;
    --brand-bg: #eaf3ff;
    --dark-btn: #3d4854;
    --text: #1a1a1a;
    --text-sub: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --surface: #ffffff;
    --surface-alt: #f7f8fa;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── 오버레이 / 모달 셸 ─────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1000;
  }
  .modal-overlay[hidden] { display: none; }

  .modal {
    width: 100%;
    max-width: 960px;
    max-height: 90vh;
    background: var(--surface);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .kakao-mark {
    flex: none;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FEE500;
    border-radius: 8px;
  }
  .kakao-mark svg { width: 17px; height: 17px; color: #3C1E1E; }
  .modal-close {
    width: 32px; height: 32px;
    border: 0; background: none; cursor: pointer;
    color: var(--text-sub); font-size: 20px; line-height: 1;
    border-radius: var(--radius);
  }
  .modal-close:hover { background: var(--surface-alt); }
  .modal-close:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .modal-body {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
    min-height: 0;
  }

  /* ── 왼쪽: 필수 진행 사항 ───────────────────────── */
  .steps-pane {
    padding: 24px 24px 0;
    background: var(--surface-alt);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .steps-pane-title,
  .form-pane-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin: 0 0 18px;
  }

  /* 아래에 콘텐츠가 더 있음을 알리는 페이드 */
  .scroll-fade {
    position: sticky;
    bottom: 0;
    height: 56px;
    margin: -56px -24px 0;
    background: linear-gradient(to bottom,
      rgba(247, 248, 250, 0) 0%,
      rgba(247, 248, 250, 0.85) 55%,
      rgba(247, 248, 250, 1) 100%);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  .steps-pane.is-scroll-end .scroll-fade { opacity: 0; }

  /* 페이드 위에 얹는 스크롤 유도 화살표 */
  .scroll-hint {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    width: 30px;
    height: 30px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    color: var(--text-sub);
    cursor: pointer;
    pointer-events: auto;
    animation: scroll-hint-bob 1.6s ease-in-out infinite;
  }
  .scroll-hint:hover { color: var(--text); border-color: var(--text-muted); }
  .scroll-hint:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .scroll-hint svg { width: 16px; height: 16px; }

  @keyframes scroll-hint-bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(3px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .scroll-hint { animation: none; }
  }

  /* 단계 카드: 각각 접고 펼칠 수 있음 */
  .step-list { list-style: none; margin: 0 0 24px; padding: 0; }

  .step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .step + .step { margin-top: 10px; }
  .step.is-open { border-color: var(--brand); }

  .step-header {
    width: 100%;
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) 16px;
    align-items: center;
    column-gap: 12px;
    padding: 16px 18px;
    background: none;
    border: 0;
    text-align: left;
    font: inherit;
    cursor: pointer;
  }
  .step-header:hover { background: var(--surface-alt); }
  .step-header:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }

  .step-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #d1d5db;
    color: #fff;
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .step.is-open .step-num { background: var(--brand); }

  .step-label {
    display: block;
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .step.is-open .step-label { color: var(--brand); }

  /* 접혀 있을 때 안에 뭐가 있는지 알려주는 요약 */
  .step-summary {
    display: block;
    margin: 4px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-muted);
  }
  .step.is-open .step-summary { display: none; }

  .step-chevron {
    width: 16px; height: 16px;
    color: var(--text-sub);
    transition: transform 0.2s ease;
  }
  .step.is-open .step-chevron { transform: rotate(180deg); color: var(--brand); }

  .step-panel { padding: 0 18px 18px; }
  .step-panel[hidden] { display: none; }

  .step-desc {
    margin: 0 0 12px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-sub);
  }

  /* 외부 링크 버튼 */
  .link-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 252px;
    max-width: 100%;
    height: 48px;
    padding: 0 20px;
    border: 0;
    border-radius: var(--radius);
    text-decoration: none;
    color: #fff;
    background: var(--dark-btn);
    font-size: 15px;
    font-weight: 600;
  }
  .link-button:hover { background: #2f3843; }
  .link-button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .link-button svg { flex: none; width: 16px; height: 16px; color: currentColor; }

  /* 채널이 없을 경우 안내 */
  .fallback-box {
    margin-top: 12px;
    padding: 14px;
    background: var(--brand-bg);
    border-radius: var(--radius);
  }
  .fallback-box p {
    margin: 0 0 6px;
    font-size: 13px;
    line-height: 1.6;
    color: #14509e;
  }
  .fallback-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand);
    text-decoration: underline;
  }
  .fallback-link svg { width: 14px; height: 14px; }

  /* 2단계 안내 이미지 */
  .guide-block { margin-top: 4px; }
  .guide-block + .guide-block { margin-top: 20px; }
  .guide-block h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .guide-block img {
    width: 100%;
    display: block;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  /* ── 오른쪽: 입력 폼 ────────────────────────────── */
  .form-pane {
    padding: 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .field { margin-bottom: 20px; }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
  }
  .field-help {
    margin: -4px 0 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-sub);
  }

  .input,
  .select {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .input::placeholder { color: var(--text-muted); }
  .input:focus,
  .select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26, 118, 255, 0.12); }

  .select {
    appearance: none;
    color: var(--text-muted);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
  }
  .select.has-value { color: var(--text); }

  /* 휴대폰번호 + 인증번호 받기 */
  .input-with-action { position: relative; }
  .input-with-action .input { padding-right: 118px; }
  .action-button {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    height: 32px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--dark-btn);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-button:hover { background: #2f3843; }
  .action-button:disabled { background: #c4c9d0; cursor: not-allowed; }
  .action-button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .field-error {
    margin: 6px 0 0;
    font-size: 12px;
    color: #d92d20;
  }
  .field-error[hidden] { display: none; }

  /* 하단 CTA */
  .form-footer { margin-top: auto; padding-top: 24px; }
  .price-note {
    margin: 0 0 12px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .submit-button {
    width: 100%;
    height: 48px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--brand);
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .submit-button:hover { background: var(--brand-hover); }
  .submit-button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ── 반응형 ────────────────────────────────────── */
  @media (max-width: 820px) {
    .modal-overlay { padding: 0; }
    .modal { max-width: none; max-height: 100vh; height: 100vh; border-radius: 0; }
    .modal-body { grid-template-columns: 1fr; overflow-y: auto; }
    .steps-pane { padding-bottom: 24px; border-right: 0; border-bottom: 1px solid var(--border); overflow: visible; }
    .step-list { margin-bottom: 0; }
    .scroll-fade { display: none; }
    .form-pane { overflow: visible; }
  }
</style>
</head>

    <div class="modal-body">

              </span>

            <div class="step-panel" id="stepPanel1">
              <p class="step-desc">아래 카카오 비즈니스에 접속하여 로그인해주세요.</p>

              <a class="link-button" href="https://business.kakao.com/" target="_blank" rel="noopener noreferrer">
                카카오 비즈니스 바로가기
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>

              <div class="fallback-box">
                <p>채널이 없다면? 카카오 비즈니스 채널을 개설해주세요.</p>
                <a class="fallback-link" href="https://blog.naver.com/joberteam/224067843145" target="_blank" rel="noopener noreferrer">
                  채널 개설 가이드 보기
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </a>
              </div>
            </div>
          </li>

          <li class="step" data-step="2">
            <button type="button" class="step-header" aria-expanded="false" aria-controls="stepPanel2">
              <span class="step-num">2</span>
              <span>
                <span class="step-label">카카오 채널 관리자센터 설정하기</span>
                <span class="step-summary">비즈니스 심사 완료 확인 · 채널 공개 설정 · 고객센터 전화번호 입력</span>
              </span>
              <svg class="step-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <div class="step-panel" id="stepPanel2" hidden>
              <div class="guide-block">

        <div class="scroll-fade">
          <button type="button" class="scroll-hint" id="scrollHint" aria-label="아래 내용 더 보기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>

      <!-- ══ 오른쪽: 입력 폼 ══ -->
      <div class="form-pane">
        <p class="form-pane-title">연동 채널 정보 입력</p>

        <div class="field">
          <label class="field-label" for="channelId">카카오 채널 검색용 아이디</label>
          <input class="input" type="text" id="channelId" placeholder="@" autocomplete="off" />
        </div>

        <div class="field">
          <label class="field-label" for="category">카테고리</label>
          <p class="field-help">해당 카테고리가 없을 경우, 유사 카테고리를 선택해 주세요.</p>
          <select class="select" id="category">
            <option value="" selected disabled>카테고리를 선택해주세요</option>
            <option value="it">IT · 정보통신</option>
            <option value="edu">교육</option>
            <option value="etc">기타</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="phone">채널 관리자 휴대폰번호</label>
          <div class="input-with-action">
            <input class="input" type="tel" id="phone" placeholder="번호를 - 없이 입력해주세요" inputmode="numeric" autocomplete="tel" />
            <button type="button" class="action-button" id="sendOtp">인증번호 받기</button>
          </div>
          <p class="field-error" id="phoneError" hidden></p>
        </div>

        <div class="field">
          <label class="field-label" for="otp" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">인증번호</label>
          <input class="input" type="text" id="otp" placeholder="인증번호 입력" inputmode="numeric" autocomplete="one-time-code" />
          <p class="field-error" id="otpError" hidden></p>
        </div>

        <div class="form-footer">
          <p class="price-note">연동비는 5만원(vat 별도)입니다.</p>
          <button type="button" class="submit-button" id="submitBtn">연동하기</button>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
(function () {
  var stepsPane = document.querySelector('.steps-pane');

  // 단계 접기/펼치기 (한 번에 하나만 열림)
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));

  function setStepOpen(step, open) {
    step.classList.toggle('is-open', open);
    step.querySelector('.step-header').setAttribute('aria-expanded', String(open));
    step.querySelector('.step-panel').hidden = !open;
  }

  steps.forEach(function (step) {
    step.querySelector('.step-header').addEventListener('click', function () {
      var willOpen = !step.classList.contains('is-open');
      // 다른 단계는 모두 닫기
      steps.forEach(function (other) {
        if (other !== step) setStepOpen(other, false);
      });
      setStepOpen(step, willOpen);
      if (willOpen) {
        // 펼친 단계의 제목이 화면에 보이도록
        stepsPane.scrollTo({ top: step.offsetTop - 12, behavior: 'smooth' });
      }
      updateFade();
    });
  });

  // 스크롤이 끝에 닿으면 페이드 숨김 (더 볼 게 없을 때 가리지 않도록)
  function updateFade() {
    var atEnd = stepsPane.scrollTop + stepsPane.clientHeight >= stepsPane.scrollHeight - 4;
    var noScroll = stepsPane.scrollHeight <= stepsPane.clientHeight + 4;
    stepsPane.classList.toggle('is-scroll-end', atEnd || noScroll);
  }
  stepsPane.addEventListener('scroll', updateFade, { passive: true });
  window.addEventListener('resize', updateFade);
  if (window.ResizeObserver) new ResizeObserver(updateFade).observe(stepsPane);
  updateFade();

  document.getElementById('scrollHint').addEventListener('click', function () {
    stepsPane.scrollBy({ top: Math.round(stepsPane.clientHeight * 0.8), behavior: 'smooth' });
  });

  // 셀렉트 값 선택 시 글자색 진하게
  var category = document.getElementById('category');
  category.addEventListener('change', function () {
    category.classList.toggle('has-value', !!category.value);
  });

  // 인증번호 받기
  var phone = document.getElementById('phone');
  var phoneError = document.getElementById('phoneError');
  var sendOtp = document.getElementById('sendOtp');

  phone.addEventListener('input', function () {
    phone.value = phone.value.replace(/[^0-9]/g, '');
    phoneError.hidden = true;
  });

  sendOtp.addEventListener('click', function () {
    if (!/^01[016789][0-9]{7,8}$/.test(phone.value)) {
      phoneError.textContent = '휴대폰번호를 - 없이 정확히 입력해주세요';
      phoneError.hidden = false;
      phone.focus();
      return;
    }
    phoneError.hidden = true;
    // TODO: 인증번호 발송 API 호출
    startCountdown(180);
  });

  function startCountdown(seconds) {
    var remain = seconds;
    sendOtp.disabled = true;
    var timer = setInterval(function () {
      remain -= 1;
      var m = Math.floor(remain / 60);
      var s = String(remain % 60).padStart(2, '0');
      sendOtp.textContent = m + ':' + s;
      if (remain <= 0) {
        clearInterval(timer);
        sendOtp.disabled = false;
        sendOtp.textContent = '인증번호 재전송';
      }
    }, 1000);
  }

  // 제출
  document.getElementById('submitBtn').addEventListener('click', function () {
    var otp = document.getElementById('otp');
    var otpError = document.getElementById('otpError');

    if (!otp.value.trim()) {
      otpError.textContent = '인증번호를 입력해주세요';
      otpError.hidden = false;
      otp.focus();
      return;
    }
    otpError.hidden = true;
    // TODO: 연동 요청 API 호출
  });

  document.getElementById('otp').addEventListener('input', function () {
    document.getElementById('otpError').hidden = true;
  });
})();
</script>
