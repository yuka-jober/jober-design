<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메시지 보내기 모달 — 자버</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
/* ── 1. RESET / LAYOUT ─────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-base);
  background: var(--color-page);
  color: var(--color-text);
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* 발송 흐름(①→②→③)을 왼쪽부터 나란히 놓는다 */
.board {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 64px 40px;
  padding: 48px 24px 80px;
}
.frame { width: 400px; max-width: 100%; }
.frame-stage { position: relative; }
.frame-hint { margin-top: 12px; }

.frame-caption {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

/* ── 2. SEND MODAL ─────────────────────────── */
/* 기본 .dialog 는 확인창용(단일 패딩)이라, 헤더·본문·하단 버튼이 분리된 발송 모달은 따로 둔다 */
.send-modal {
  display: flex;
  flex-direction: column;
  background: var(--color-surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-4);
  overflow: hidden;
}

.send-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 12px 12px 20px;
  border-bottom: 1px solid var(--color-border-split);
}

.send-modal-body {
  display: flex;
  flex-direction: column;
  padding: 20px 20px 4px;
}

/* 받는사람 요약 카드 */
.summary {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px 20px;
  margin-bottom: 8px;
  background: var(--color-bg-base);
  border-radius: var(--r-lg);
}
.summary-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.summary-divider {
  height: 1px;
  background: var(--color-border-split);
}
.channel-row  { margin-top: 12px; }
.summary-hint { margin-top: 8px; }

/* 발송 채널 표시 — 자버문서 알림톡 채널 */
.channel {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
/* 실제 알림톡 프로필 사진과 같은 모양 — 검정 바탕에 흰 jober 워드마크 */
.channel-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--icon-xl);
  height: var(--icon-xl);
  border-radius: var(--r-sm);
  background: var(--color-jober);
  color: var(--color-on-jober);
}
.channel-logo .icon { width: 72%; height: auto; aspect-ratio: 764 / 250; }
.channel .btn-link { height: auto; padding: 0; }
.channel .divider-vertical {
  align-self: center;
  height: 12px;
  margin: 0;
  border-color: var(--color-border);
}

/* 테두리 박스 안 체크박스 — 보내기 예약, 휴대폰 본인인증 */
.check-field {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--r-md);
  cursor: pointer;
}
.check-field-inline {
  display: inline-flex;
  background: var(--color-surface-sub);
}

/* 옵션 행 — 보내기 예약(토글)과 추가 설정(아코디언)이 같은 머리 모양을 쓴다 */
.option { border-top: 1px solid var(--color-border-split); }
.option-head,
.extra-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 56px;
  padding: 16px 0;
  border: 0;
  background: none;
  font-family: var(--font-base);
  color: var(--color-text);
  cursor: pointer;
}
.option-label,
.extra-toggle-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.extra-toggle .chevron {
  color: var(--color-text-secondary);
  transition: transform var(--motion-standard) var(--ease-standard);
}
.extra.is-open .chevron { transform: rotate(180deg); }
.extra-panel {
  display: none;
  flex-direction: column;
  gap: 20px;
  padding: 4px 0 16px;
}

/* 예약 완료 후 — 토글 아래 보조 문구로 예약 일시를 보여준다 (아이콘 폭만큼 들여씀) */
.schedule-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -8px 0 16px;
  padding-left: calc(var(--icon-md) + 8px);
}
.schedule-summary[hidden] { display: none; }
.schedule-summary .btn-link { height: auto; padding: 0; }
.schedule-summary .divider-vertical { align-self: center; height: 12px; margin: 0; border-color: var(--color-border); }
.extra.is-open .extra-panel { display: flex; }

.field { display: flex; flex-direction: column; gap: 8px; }
.field .label { font-weight: var(--fw-regular); }
.field-hash { font-size: var(--fs-16); color: var(--color-text); }

/* 폴더 설정 — 현재 폴더(링크)를 누르면 아래에 폴더 선택기가 열린다 */
.folder-current { align-self: flex-start; height: auto; padding: 0; }
.folder-picker { display: none; flex-direction: column; gap: 8px; }
.folder-picker.is-open { display: flex; }
.folder-picker-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.folder-picker-bar label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.folder-box {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  border: 1px solid var(--color-border);
  border-radius: var(--r-sm);
}
.folder-list { list-style: none; }
.folder-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4px 12px;
  border: 0;
  background: none;
  font-family: var(--font-base);
  color: var(--color-text);
  text-align: left;
  cursor: pointer;
}
.folder-item:hover { background: var(--color-bg-light); }
.folder-item.is-selected { background: var(--color-primary-bg); color: var(--color-primary); }
.folder-empty { padding: 4px 12px; }


/* 하단 버튼 — 좌우 반반, 모달 가장자리까지 꽉 채운다 */
.send-modal-footer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-top: 8px;
  border-top: 1px solid var(--color-border-split);
}
.send-modal-footer .btn { border-radius: 0; }

/* ── 3. 보내기 예약 모달 ───────────────────── */
.reserve-body {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 20px;
}
.reserve-date { display: flex; flex-direction: column; gap: 8px; }
.reserve-date [hidden] { display: none; }

/* 선택된 프리셋을 "오늘  2026-10-06 (화)" 처럼 날짜만 흐리게 보여준다.
   네이티브 select 는 부분 색을 못 넣어서, 글씨를 숨기고 위에 같은 문구를 덮는다 */
.select-display {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--control-px-lg);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-16);
  pointer-events: none;
}
.select-display ~ .select { color: transparent; }
.select-display ~ .select option { color: var(--color-text); }
.select-display-sub { font-size: var(--fs-14); color: var(--color-text-secondary); }

.native-date { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.input-trigger { cursor: pointer; }

.info-note {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: var(--color-bg-base);
  border-radius: var(--r-md);
  color: var(--color-text-secondary);
}
.info-note .icon { margin-top: 4px; }

/* 시안 안에서 띄우는 예약 모달 — 발송 모달 위에 딤을 깔고 가운데에 둔다 */
.frame-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: var(--color-scrim);
  border-radius: var(--r-lg);
}
.frame-overlay .send-modal { width: 100%; }
</style>
</head>
<body>
<script src="../../assets/icons.js"></script>

<!-- 같은 모달 마크업을 템플릿으로 두고, 발송 수단별로 채널 안내 유무·연락처만 바꿔 찍는다 -->

          <span class="text-14">교보DTS 서다영님</span>
        </div>
        <div class="summary-row">
          <span class="text-14 font-bold">받는 사람 연락처</span>

                </label>
                <button class="btn btn-md btn-default folder-fold" type="button">

                  <span>모두 접기</span>

<!-- 시안별 설정: data-frame=send(발송 모달) | reserve(예약 모달만)
     ① ③ 와 이메일은 토글·변경을 누르면 실제로 예약 모달이 떠서 흐름을 따라가 볼 수 있다 -->
<main class="board">
  <section class="frame" data-frame="send" data-channel="card" data-contact="010-0000-0000">
    <div class="frame-caption">
      <span class="text-12 text-secondary">① 휴대폰 발송 · 카카오 알림톡</span>
    </div>
  </section>

  <section class="frame" data-frame="reserve" data-mode="preset">
    <div class="frame-caption">
      <span class="text-12 text-secondary">② 예약 모달 · 오늘/내일/모레/3일 후</span>
    </div>
  </section>

  <section class="frame" data-frame="reserve" data-mode="custom">
    <div class="frame-caption">
      <span class="text-12 text-secondary">② 예약 모달 · 사용자 정의</span>
    </div>
  </section>

  <section class="frame" data-frame="send" data-channel="card" data-contact="010-0000-0000" data-reserved="1">
    <div class="frame-caption">
      <span class="text-12 text-secondary">③ 휴대폰 발송 · 예약 완료 후</span>
    </div>
  </section>

  <section class="frame" data-frame="send" data-channel="none" data-contact="dys2407@kyobodts.co.kr">
    <div class="frame-caption">
      <span class="text-12 text-secondary">이메일 발송</span>
      <span class="badge badge-sm badge-weak-neutral">채널 안내 미노출</span>
    </div>
  </section>
</main>

<script>
const tpl = document.getElementById('send-modal-tpl');
const FOLDERS = [
  '01 공유 폴더', '02 마케팅 콘텐츠 폴더', '03 계약서 폴더',
  '2026-09-18-19:29:43_[카카오 메시지]', '2026-09-18-20:11:42_[카카오 메시지]',
  '테스트 폴더', '펠로우즈 1회차 안내', '휴지통', '미분류',
];

function setupFolderPicker(modal) {
  const current = modal.querySelector('.folder-current');
  const currentName = current.querySelector('[data-slot="folder-name"]');
  const picker = modal.querySelector('.folder-picker');
  const list = picker.querySelector('.folder-list');
  const search = picker.querySelector('.folder-search');
  const clear = picker.querySelector('.input-clear');
  const empty = picker.querySelector('.folder-empty');
  const fold = picker.querySelector('.folder-fold');

  list.innerHTML = FOLDERS.map((name) => `
    <li><button class="folder-item text-14" type="button" data-name="${name}">
      <svg class="icon"><use href="#folder-outlined"></use></svg>${name}
    </button></li>`).join('');

  const markSelected = () => list.querySelectorAll('.folder-item').forEach((b) =>
    b.classList.toggle('is-selected', b.dataset.name === currentName.textContent));
  markSelected();

  current.addEventListener('click', () => {
    const open = picker.classList.toggle('is-open');
    current.setAttribute('aria-expanded', open);
  });

  list.addEventListener('click', (e) => {
    const item = e.target.closest('.folder-item');
    if (!item) return;
    currentName.textContent = item.dataset.name;
    markSelected();
  });

  const filter = () => {
    const q = search.value.trim();
    let shown = 0;
    list.querySelectorAll('li').forEach((li) => {
      const hit = li.firstElementChild.dataset.name.includes(q);
      li.hidden = !hit;
      if (hit) shown++;
    });
    empty.hidden = shown > 0;
    clear.hidden = !search.value;
  };
  search.addEventListener('input', filter);
  clear.addEventListener('click', () => { search.value = ''; filter(); search.focus(); });

  // 하위 폴더 접기/펼치기 — 라벨과 화살표만 바뀐다 (목업에 하위 폴더가 없음)
  fold.addEventListener('click', () => {
    const folded = fold.classList.toggle('is-folded');
    fold.querySelector('span').textContent = folded ? '모두 펼치기' : '모두 접기';
    fold.querySelector('use').setAttribute('href', folded ? '#caret-down-filled' : '#caret-right-filled');
  });
}

// ── 보내기 예약 ──────────────────────────────
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const DAY_PRESETS = [['0', '오늘'], ['1', '내일'], ['2', '모레'], ['3', '3일 후']];
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fullDate = (d) => `${isoDate(d)} (${WEEK[d.getDay()]})`;
const shortDate = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일(${WEEK[d.getDay()]})`;
const addDays = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d; };

// 30분 단위 — 값은 분(0~1410), 표시는 "오전 9:00"
const TIMES = Array.from({ length: 48 }, (_, i) => i * 30);
const timeLabel = (min) => {
  const h = Math.floor(min / 60), m = min % 60;
  return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${pad(m)}`;
};
const DEFAULT_TIME = 9 * 60;

// 고른 날이 오늘이면 지금 이후의 가장 가까운 30분 칸부터 고를 수 있다. 오늘이 아니면 0
const minTimeFor = (date) => {
  const now = new Date();
  if (isoDate(date) !== isoDate(now)) return 0;
  return Math.floor((now.getHours() * 60 + now.getMinutes()) / 30) * 30 + 30;
};

// state: { day: '0'~'3' | 'custom', date: 'YYYY-MM-DD' | '', time: 분 | null }
function createReserveModal(state, { onClose, onDone } = {}) {
  const modal = document.getElementById('reserve-modal-tpl').content.firstElementChild.cloneNode(true);
  const daySel = modal.querySelector('.reserve-day');
  const display = modal.querySelector('.select-display');
  const custom = modal.querySelector('.reserve-custom');
  const dateText = modal.querySelector('.reserve-date-text');
  const nativeDate = modal.querySelector('.native-date');
  const timeSel = modal.querySelector('.reserve-time');
  const done = modal.querySelector('.reserve-done');

  daySel.innerHTML = DAY_PRESETS.map(([v, label]) =>
    `<option value="${v}">${label}  ${fullDate(addDays(+v))}</option>`).join('')
    + '<option value="custom">사용자 정의</option>';
  timeSel.innerHTML = '<option value="" disabled>시간 선택</option>'
    + TIMES.map((t) => `<option value="${t}">${timeLabel(t)}</option>`).join('');
  nativeDate.min = isoDate(addDays(0));

  // 오늘 남은 칸이 없으면(23:30 이후) '오늘' 프리셋을 막는다
  const todayFull = minTimeFor(addDays(0)) > TIMES.at(-1);
  daySel.querySelector('option[value="0"]').disabled = todayFull;

  const s = { ...state };
  if (s.day === '0' && todayFull) s.day = '1';

  const render = () => {
    daySel.value = s.day;
    const isCustom = s.day === 'custom';
    const date = isCustom ? (s.date && new Date(`${s.date}T00:00`)) : addDays(+s.day);
    const min = date ? minTimeFor(date) : 0;
    timeSel.querySelectorAll('option[value]:not([value=""])').forEach((o) => { o.disabled = +o.value < min; });
    // 지난 시간이 골라져 있으면 가장 가까운 다음 칸으로 옮긴다
    if (s.time != null && s.time < min) s.time = TIMES.find((t) => t >= min) ?? null;

    display.innerHTML = isCustom ? '사용자 정의'
      : `${DAY_PRESETS.find(([v]) => v === s.day)[1]}<span class="select-display-sub">${fullDate(addDays(+s.day))}</span>`;
    custom.hidden = !isCustom;
    dateText.value = s.date ? fullDate(new Date(`${s.date}T00:00`)) : '';
    nativeDate.value = s.date;
    timeSel.value = s.time ?? '';
    done.disabled = s.time == null || (isCustom && !s.date);
  };

  daySel.addEventListener('change', () => {
    s.day = daySel.value;
    // 사용자 정의는 날짜·시간을 직접 고르게 비워두고, 프리셋으로 돌아오면 기본 시간을 채운다
    if (s.day === 'custom') { s.date = ''; s.time = null; }
    else if (s.time == null) s.time = DEFAULT_TIME;
    render();
  });
  dateText.addEventListener('click', () => nativeDate.showPicker?.());
  nativeDate.addEventListener('change', () => { s.date = nativeDate.value; render(); });
  timeSel.addEventListener('change', () => { s.time = +timeSel.value; render(); });
  modal.querySelectorAll('.reserve-close').forEach((b) => b.addEventListener('click', () => onClose?.()));
  done.addEventListener('click', () => onDone?.({ ...s }));

  render();
  return modal;
}

const reservedDate = (s) => (s.day === 'custom' ? new Date(`${s.date}T00:00`) : addDays(+s.day));

function setupSchedule(modal, stage, initial) {
  const toggle = modal.querySelector('.schedule-toggle');
  const summary = modal.querySelector('.schedule-summary');
  const when = modal.querySelector('.schedule-when');
  const cta = modal.querySelector('.send-cta');
  let reservation = initial;

  const render = () => {
    toggle.checked = !!reservation;
    summary.hidden = !reservation;
    if (reservation) when.textContent = `${shortDate(reservedDate(reservation))} ${timeLabel(reservation.time)}`;
    cta.textContent = reservation ? '예약 보내기' : '바로 보내기';
  };

  const openReserve = () => {
    const overlay = document.createElement('div');
    overlay.className = 'frame-overlay';
    const close = () => { overlay.remove(); render(); };
    overlay.appendChild(createReserveModal(
      reservation ?? { day: '0', date: '', time: DEFAULT_TIME },
      { onClose: close, onDone: (s) => { reservation = s; close(); } },
    ));
    stage.appendChild(overlay);
  };

  // 켜는 순간에는 바로 켜지 않고 예약 모달을 띄운다. 끄면 예약을 지운다
  toggle.addEventListener('change', () => {
    if (toggle.checked) { toggle.checked = false; openReserve(); }
    else { reservation = null; render(); }
  });
  modal.querySelector('.schedule-edit').addEventListener('click', openReserve);

  render();
}

document.querySelectorAll('[data-frame="reserve"]').forEach((frame) => {
  const state = frame.dataset.mode === 'custom'
    ? { day: 'custom', date: '', time: null }
    : { day: '0', date: '', time: DEFAULT_TIME };
  frame.appendChild(createReserveModal(state));
});

document.querySelectorAll('[data-frame="send"]').forEach((frame) => {
  const modal = tpl.content.firstElementChild.cloneNode(true);

  modal.querySelector('[data-slot="contact"]').textContent = frame.dataset.contact;
  if (frame.dataset.channel !== 'card') modal.querySelector('[data-slot="channel-card"]').remove();
  const stage = document.createElement('div');
  stage.className = 'frame-stage';
  stage.appendChild(modal);
  setupSchedule(modal, stage, frame.dataset.reserved ? { day: '1', date: '', time: DEFAULT_TIME } : null);

  const extra = modal.querySelector('.extra');
  const toggle = extra.querySelector('.extra-toggle');
  const gear = toggle.querySelector('.extra-toggle-label use');
  toggle.addEventListener('click', () => {
    const open = extra.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open);
    gear.setAttribute('href', open ? '#setting-filled' : '#setting-outlined');
  });

  setupFolderPicker(modal);

  frame.appendChild(stage);
});
</script>
